<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FCNOISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --tx:#f4f4f7; --tx3:#8b909a;
  --orange:#ff7a00; --blu:#3b82f6;
  --font-display:'Bebas Neue','Impact',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font-body);overflow:hidden;}
/* fondo con blobs de color que el vidrio recoge */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 16s ease-in-out infinite;}
.blob.o{width:520px;height:520px;background:radial-gradient(circle,rgba(255,122,0,.55),transparent 70%);top:-140px;left:-100px;}
.blob.b{width:560px;height:560px;background:radial-gradient(circle,rgba(59,130,246,.5),transparent 70%);bottom:-180px;right:-120px;animation-delay:-8s;}
.blob.p{width:360px;height:360px;background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%);top:40%;left:45%;animation-delay:-4s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-30px) scale(1.08);}}

.stage{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px;}
.brand{font-family:var(--font-display);font-size:clamp(46px,12vw,84px);letter-spacing:.02em;line-height:.95;margin-bottom:40px;text-shadow:0 2px 40px rgba(0,0,0,.5);}
.brand em{color:var(--orange);font-style:normal;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;width:100%;max-width:720px;}

.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-decoration:none;color:inherit;min-height:220px;padding:26px;border-radius:28px;overflow:hidden;cursor:pointer;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  backdrop-filter:blur(26px) saturate(1.5); -webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.14); border-top-color:rgba(255,255,255,.28);
  box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -30px 60px rgba(0,0,0,.18);
  transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s, border-color .3s;}
.card::after{content:"";position:absolute;inset:0;border-radius:28px;background:radial-gradient(180px 120px at 30% 0%,rgba(255,255,255,.14),transparent 70%);pointer-events:none;}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 34px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.24);border-top-color:rgba(255,255,255,.4);}
.card:active{transform:translateY(-2px) scale(.99);}
.card-ico{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);}
.card-ttl{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;line-height:1.02;}
.card-arw{position:absolute;top:28px;right:26px;font-size:20px;opacity:.5;transition:transform .3s,opacity .3s;}
.card:hover .card-arw{transform:translateX(5px);opacity:1;}
.card.fcn{box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -30px 70px rgba(255,122,0,.10);}
.card.fcn .card-ttl,.card.fcn .card-arw{color:var(--orange);}
.card.spo{box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -30px 70px rgba(59,130,246,.12);}
.card.spo .card-ttl,.card.spo .card-arw{color:var(--blu);}
</style>
</head>
<body>
<div class="bgfx"><div class="blob o"></div><div class="blob b"></div><div class="blob p"></div></div>
<div class="stage">
  <div class="brand">FC<em>NOISE</em></div>
  <div class="grid">
    <a class="card fcn" href="./portal.html">
      <div class="card-ico">⚽</div>
      <div class="card-ttl">Project<br>FCNOISE</div>
      <span class="card-arw">→</span>
    </a>
    <a class="card spo" href="./sponsor.html">
      <div class="card-ico">🤝</div>
      <div class="card-ttl">Portal<br>Sponsors</div>
      <span class="card-arw">→</span>
    </a>
  </div>
</div>
</body>
</html>
