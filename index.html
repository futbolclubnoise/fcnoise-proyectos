<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FCNOISE — Proyectos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════ TOKENS ═══════════════════════ */
:root {
  --bg:#0f0f13;--bg2:#16161d;--bg3:#1d1d26;--bg4:#242430;--bg5:#2c2c3a;
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);--bd3:rgba(255,255,255,.18);
  --tx:#eeeef5;--tx2:#c0c0d0;--tx3:#7878a0;
  --card:#1a1a24;--inp:#1d1d28;--shadow:0 2px 12px rgba(0,0,0,.5);
  --red:#f04040;--red2:rgba(240,64,64,.12);--red3:rgba(240,64,64,.28);
  --grn:#34c472;--grn2:rgba(52,196,114,.12);--grn3:rgba(52,196,114,.28);
  --org:#f08030;--org2:rgba(240,128,48,.12);--org3:rgba(240,128,48,.28);
  --blu:#4898ff;--blu2:rgba(72,152,255,.12);--blu3:rgba(72,152,255,.28);
  --pur:#9060e8;--pur2:rgba(144,96,232,.12);--pur3:rgba(144,96,232,.28);
  --yel:#e8c030;--yel2:rgba(232,192,48,.12);--yel3:rgba(232,192,48,.28);
  --r:10px;
  --accent:#f08030;--ac2:rgba(240,128,48,.12);--ac3:rgba(240,128,48,.28);
}
body.light {
  --bg:#f2f2f7;--bg2:#ffffff;--bg3:#f7f7fc;--bg4:#ececf4;--bg5:#e2e2ec;
  --bd:rgba(0,0,0,.06);--bd2:rgba(0,0,0,.1);--bd3:rgba(0,0,0,.18);
  --tx:#111118;--tx2:#33333f;--tx3:#6666880;
  --card:#ffffff;--inp:#f2f2f7;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body.light{--tx3:#66668a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;transition:background .25s,color .25s;}

/* ── NAV ── */
.nav{height:56px;background:var(--bg2);border-bottom:1px solid var(--bd2);display:flex;align-items:center;padding:0 18px;gap:8px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.nav-brand{font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;flex-shrink:0;margin-right:8px;}
.nav-brand em{color:var(--accent);font-style:normal;}
.nav-links{display:flex;gap:2px;flex:1;}
.nav-link{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;transition:all .2s;border:none;background:transparent;font-family:'Inter',sans-serif;white-space:nowrap;}
.nav-link:hover{background:var(--bg4);color:var(--tx);}
.nav-link.on{background:var(--bg4);color:var(--tx);}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg3);color:var(--tx2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.theme-btn:hover{background:var(--bg4);}
.sync-dot{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--tx3);border:1px solid var(--bd2);}
.user-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--ac3);background:var(--ac2);color:var(--accent);cursor:pointer;flex-shrink:0;}

/* ── LOGIN ── */
#screen-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;}
.login-logo{font-size:32px;font-weight:700;letter-spacing:2px;margin-bottom:4px;}
.login-logo em{color:var(--accent);font-style:normal;}
.login-sub{font-size:12px;color:var(--tx3);margin-bottom:36px;}
.login-box{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--bd2);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);}
.fi{margin-bottom:14px;}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;}
.fi input,.fi select,.fi textarea{width:100%;padding:10px 13px;background:var(--inp);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--accent);}
.fi select option{background:var(--bg3);}
.fi textarea{resize:vertical;min-height:66px;}
.login-err{font-size:11px;color:var(--red);background:var(--red2);border:1px solid var(--red3);padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none;}
.login-err.show{display:block;}

/* ── BUTTONS ── */
.btn{padding:10px 18px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.2px;}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{opacity:.85;}
.btn-g{background:var(--bg4);color:var(--tx2);border:1px solid var(--bd2);}
.btn-g:hover{background:var(--bg5);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;}
.btn-icon{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--bg4);border:1px solid var(--bd2);color:var(--tx3);cursor:pointer;font-size:13px;flex-shrink:0;transition:all .2s;}
.btn-icon:hover{background:var(--bg5);color:var(--tx);}
.btn-del{color:var(--red);}
.btn-del:hover{background:var(--red2);border-color:var(--red3);}
.w-full{width:100%;}

/* ── APP BODY ── */
.app-body{padding:18px;max-width:1100px;margin:0 auto;}

/* ── PAGE HEADER ── */
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.page-title{font-size:18px;font-weight:700;}
.back-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;padding:5px 10px;border-radius:7px;border:1px solid var(--bd2);background:var(--bg3);transition:all .2s;}
.back-btn:hover{background:var(--bg4);color:var(--tx);}

/* ── USER BANNER ── */
.user-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);margin-bottom:20px;border:1px solid var(--ac3);background:var(--ac2);}
.ub-av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;background:var(--ac3);}
.ub-name{font-size:16px;font-weight:700;}
.ub-role{font-size:11px;color:var(--tx3);margin-top:2px;}

/* ── TASK SUB-TABS ── */
.sub-tabs{display:flex;gap:5px;margin-bottom:18px;}
.stab{padding:6px 16px;border-radius:20px;font-size:11px;font-weight:600;color:var(--tx3);cursor:pointer;border:1px solid var(--bd2);background:transparent;font-family:'Inter',sans-serif;transition:all .2s;}
.stab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── TASK CARD ── */
.task-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;transition:border-color .2s;}
.task-card:hover{border-color:var(--bd3);}
.task-card.done-c{opacity:.5;}
.task-card.overdue-c{border-left:3px solid var(--red);}
.task-card.today-c{border-left:3px solid var(--accent);}
.tc-row{display:flex;align-items:flex-start;gap:10px;}
.tc-chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--bd3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .2s;}
.tc-chk.on{background:var(--grn);border-color:var(--grn);}
.tc-chk svg{width:10px;height:10px;stroke:#fff;opacity:0;transition:opacity .2s;}
.tc-chk.on svg{opacity:1;}
.tc-body{flex:1;min-width:0;}
.tc-name{font-size:13px;font-weight:600;}
.tc-name.done-txt{text-decoration:line-through;color:var(--tx3);}
.tc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center;}
.tc-acts{display:flex;gap:5px;flex-shrink:0;}

/* ── BADGE ── */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.3px;}
.br{background:var(--red2);color:var(--red);border:1px solid var(--red3);}
.bo{background:var(--org2);color:var(--org);border:1px solid var(--org3);}
.bg{background:var(--grn2);color:var(--grn);border:1px solid var(--grn3);}
.bb{background:var(--blu2);color:var(--blu);border:1px solid var(--blu3);}
.bp{background:var(--pur2);color:var(--pur);border:1px solid var(--pur3);}
.by{background:var(--yel2);color:var(--yel);border:1px solid var(--yel3);}
.bw{background:var(--bg5);color:var(--tx3);border:1px solid var(--bd2);}

/* ── PROJECTS GRID ── */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.proj-card{background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;position:relative;}
.proj-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow);}
.pc-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.pc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.pc-meta{flex:1;min-width:0;}
.pc-name{font-size:14px;font-weight:700;line-height:1.3;}
.pc-desc{font-size:11px;color:var(--tx3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center;}
.team-dots{display:flex;gap:-4px;}
.udot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:2px solid var(--bg2);flex-shrink:0;}
.prog-bg{height:4px;background:var(--bg5);border-radius:4px;overflow:hidden;margin-top:10px;}
.prog-fill{height:100%;border-radius:4px;transition:width .4s;}
.pc-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .2s;}
.proj-card:hover .pc-actions{opacity:1;}

/* ── PROJECT DETAIL ── */
.proj-detail-hdr{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:20px;margin-bottom:18px;}
.pdh-top{display:flex;align-items:flex-start;gap:14px;}
.pdh-icon{width:52px;height:52px;border-radius:12px;font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pdh-info{flex:1;}
.pdh-name{font-size:20px;font-weight:700;}
.pdh-desc{font-size:12px;color:var(--tx3);margin-top:4px;}
.pdh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;}
.meth-tabs{display:flex;gap:5px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);}
.meth-tab{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;color:var(--tx3);cursor:pointer;border:1px solid var(--bd2);background:transparent;font-family:'Inter',sans-serif;transition:all .2s;}
.meth-tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── KANBAN ── */
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{min-width:220px;width:220px;background:var(--bg3);border-radius:12px;flex-shrink:0;}
.kb-hdr{padding:12px 14px 8px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);}
.kb-count{background:var(--bg5);color:var(--tx3);padding:1px 7px;border-radius:20px;font-size:9px;}
.kb-body{padding:8px;min-height:120px;transition:background .2s;}
.kb-body.drag-over{background:var(--bg5);}
.kb-card{background:var(--card);border:1px solid var(--bd2);border-radius:9px;padding:10px;margin-bottom:7px;cursor:grab;transition:box-shadow .2s;user-select:none;}
.kb-card:active{cursor:grabbing;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.kb-card.dragging{opacity:.4;}
.kb-name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:7px;}
.kb-chips{display:flex;flex-wrap:wrap;gap:3px;}
/* mobile move button */
.kb-move{display:none;width:100%;margin-top:7px;padding:4px;background:var(--bg4);border:1px solid var(--bd2);border-radius:6px;font-size:10px;color:var(--tx3);cursor:pointer;font-family:'Inter',sans-serif;}
@media(max-width:600px){.kb-move{display:block;}}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-size:16px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-hdr{text-align:center;font-size:9px;font-weight:700;color:var(--tx3);padding:5px 0;text-transform:uppercase;}
.cal-cell{min-height:80px;background:var(--bg3);border-radius:8px;padding:6px;border:1px solid transparent;transition:border-color .2s;}
.cal-cell:hover{border-color:var(--bd2);}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.empty{background:transparent;}
.cal-date{font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:4px;}
.cal-date.is-today{background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-task-chip{font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:opacity .2s;}
.cal-task-chip:hover{opacity:.8;}
.cal-no-date{margin-top:14px;padding:14px;background:var(--bg3);border-radius:var(--r);}

/* ── PANEL ── */
.panel{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-ttl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);}

/* ── ASSIGN CHIPS ── */
.assign-grid{display:flex;flex-wrap:wrap;gap:7px;}
.a-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--bd2);background:var(--bg4);cursor:pointer;font-size:11px;font-weight:600;color:var(--tx2);user-select:none;transition:all .2s;}
.a-chip input{display:none;}
.a-chip.sel{border-color:var(--accent);background:var(--ac2);color:var(--accent);}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sbox{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;}
.snum{font-size:24px;font-weight:700;color:var(--accent);}
.slbl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}

/* ── TABLE ── */
.rtbl{width:100%;border-collapse:collapse;}
.rtbl th{text-align:left;padding:8px 10px;font-size:9px;color:var(--tx3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--bd2);}
.rtbl td{padding:10px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle;}
.rtbl tr:last-child td{border-bottom:none;}
.rtbl tr:hover td{background:var(--bg4);}

/* ── FORM ROW ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}

/* ── MODAL ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
@media(min-width:600px){.mov{align-items:center;}}
.mov.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg3);border:1px solid var(--bd2);border-radius:16px 16px 0 0;padding:22px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s;box-shadow:var(--shadow);}
@media(min-width:600px){.modal{border-radius:16px;transform:translateY(8px);}}
.mov.open .modal{transform:translateY(0);}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mttl{font-size:14px;font-weight:700;letter-spacing:.3px;}
.mclose{width:28px;height:28px;border:none;background:var(--bg5);border-radius:7px;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}

/* ── ALERT MODAL ── */
#m-alert .modal{border-top:3px solid var(--org);}
.al-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);}
.al-item:last-child{border-bottom:none;}
.al-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--tx3);}
.empty-ico{font-size:34px;margin-bottom:10px;}

/* ── UTILS ── */
.hidden{display:none!important;}
.flex{display:flex;align-items:center;}
.gap-6{gap:6px;}
.gap-10{gap:10px;}
.ml-auto{margin-left:auto;}
.divider{height:1px;background:var(--bd);margin:14px 0;}
.sec-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;padding-left:2px;}
.sec-lbl:first-child{margin-top:0;}
.txt-xs{font-size:10px;}
.txt-muted{color:var(--tx3);}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="screen-login">
  <div class="login-logo">FC<em>NOISE</em></div>
  <div class="login-sub">Gestión de Proyectos Internos</div>
  <div class="login-box">
    <div class="fi"><label>Usuario</label>
      <select id="l-user">
        <option value="">Selecciona…</option>
        <option value="leonardo">Leonardo</option>
        <option value="veronica">Verónica</option>
        <option value="laura">Laura</option>
        <option value="editor">Editor</option>
      </select>
    </div>
    <div class="fi"><label>Contraseña</label>
      <input type="password" id="l-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="login-err" id="l-err">Usuario o contraseña incorrectos</div>
    <button class="btn btn-p w-full" onclick="login()">Entrar</button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="screen-app" class="hidden">
  <nav class="nav">
    <div class="nav-brand">FC<em>NOISE</em></div>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-right">
      <div class="sync-dot" id="sync-dot">💾 Local</div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
      <div class="user-av" id="nav-av" title="Cerrar sesión" onclick="logout()"></div>
    </div>
  </nav>

  <div class="app-body">

    <!-- MIS TAREAS -->
    <div id="view-tasks" class="hidden">
      <div class="user-banner" id="u-banner">
        <div class="ub-av" id="u-av"></div>
        <div>
          <div class="ub-name" id="u-name"></div>
          <div class="ub-role" id="u-role"></div>
        </div>
        <div style="margin-left:auto;text-align:right;">
          <div style="font-size:22px;font-weight:700;" id="u-pend">0</div>
          <div class="txt-xs txt-muted">pendientes</div>
        </div>
      </div>
      <div class="sub-tabs">
        <button class="stab on" onclick="stab('hoy',this)">📅 Hoy</button>
        <button class="stab" onclick="stab('semana',this)">📆 Semana</button>
        <button class="stab" onclick="stab('prioridad',this)">🔴 Prioridad</button>
      </div>
      <div id="v-hoy"></div>
      <div id="v-semana" class="hidden"></div>
      <div id="v-prioridad" class="hidden"></div>
    </div>

    <!-- PROYECTOS -->
    <div id="view-projs" class="hidden">
      <div class="page-hdr">
        <div class="page-title">Proyectos</div>
        <div class="ml-auto" id="btn-new-proj-wrap"></div>
      </div>
      <div class="proj-grid" id="proj-grid"></div>
    </div>

    <!-- PROYECTO DETALLE -->
    <div id="view-proj-detail" class="hidden">

<script type="module">
import { firebaseInit, isConnected, listenProjects, listenTasks, fbSaveProject, fbDeleteProject, fbSaveTask, fbDeleteTask } from './firebase.js';

/* ═══ CONSTANTS ═══ */
const USERS = {
  leonardo:{ id:'leonardo', name:'Leonardo', ini:'LE', pass:'123456', role:'ceo' },
  veronica:{ id:'veronica', name:'Verónica',  ini:'VE', pass:'123456', role:'estratega' },
  laura:   { id:'laura',    name:'Laura',     ini:'LA', pass:'123456', role:'asistente' },
  editor:  { id:'editor',   name:'Editor',    ini:'ED', pass:'123456', role:'diseno' },
};
const ROLES = {
  ceo:      {label:'CEO',       color:'var(--org)',bg:'var(--org2)',brd:'var(--org3)'},
  estratega:{label:'Estratega', color:'var(--blu)',bg:'var(--blu2)',brd:'var(--blu3)'},
  asistente:{label:'Asistente', color:'var(--grn)',bg:'var(--grn2)',brd:'var(--grn3)'},
  diseno:   {label:'Diseño',    color:'var(--pur)',bg:'var(--pur2)',brd:'var(--pur3)'},
};
const AREAS = {
  marketing:  {label:'Marketing',   icon:'📣', cls:'bo'},
  estrategia: {label:'Estrategia',  icon:'📊', cls:'bb'},
  operaciones:{label:'Operaciones', icon:'⚡', cls:'bg'},
  diseno:     {label:'Diseño',      icon:'🎨', cls:'bp'},
  general:    {label:'General',     icon:'💼', cls:'bw'},
};
const PRIOS = {
  alta: {label:'Alta', cls:'br'},
  media:{label:'Media',cls:'by'},
  baja: {label:'Baja', cls:'bg'},
};
const KB_COLS = [
  {id:'investigacion', label:'Investigación', icon:'🔍', cls:'bb'},
  {id:'ideacion',      label:'Ideación',      icon:'💡', cls:'by'},
  {id:'planeacion',    label:'Planeación',    icon:'📋', cls:'bo'},
  {id:'ejecucion',     label:'Ejecución',     icon:'⚡', cls:'br'},
  {id:'cierre',        label:'Cierre',        icon:'✅', cls:'bg'},
];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

/* ═══ STATE ═══ */
let currentUser  = null;
let currentView  = 'tasks';
let currentProjId= null;
let currentMeth  = 'lista';
let calYear = new Date().getFullYear();
let calMonth= new Date().getMonth();
let _projects= [], _tasks= [], _fbOn= false;
let dragId   = null;

const LS = { proj:'fcn_projects', task:'fcn_tasks', user:'fcn_session', theme:'fcn_theme' };

/* ═══ DATA LAYER ═══ */
function loadProjects(){ return _projects; }
function loadTasks()   { return _tasks; }
function saveProjects(d){ _projects=d; localStorage.setItem(LS.proj,JSON.stringify(d)); }
function saveTasks(d)   { _tasks=d;    localStorage.setItem(LS.task,JSON.stringify(d)); }
async function persistProject(p){
  saveProjects([..._projects.filter(x=>x.id!==p.id),p].sort((a,b)=>a.createdAt-b.createdAt));
  if(_fbOn) await fbSaveProject(p);
}
async function persistTask(t){
  saveTasks([..._tasks.filter(x=>x.id!==t.id),t].sort((a,b)=>a.createdAt-b.createdAt));
  if(_fbOn) await fbSaveTask(t);
}
async function removeProject(id){
  saveProjects(_projects.filter(p=>p.id!==id));
  saveTasks(_tasks.filter(t=>t.projectId!==id));
  if(_fbOn) await fbDeleteProject(id);
}
async function removeTask(id){
  saveTasks(_tasks.filter(t=>t.id!==id));
  if(_fbOn) await fbDeleteTask(id);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ═══ FIREBASE ═══ */
async function initData(){
  _fbOn = firebaseInit();
  setSyncDot(_fbOn);
  if(_fbOn){
    listenProjects(docs=>{ _projects=docs; onDataChange(); });
    listenTasks(docs=>{ _tasks=docs; onDataChange(); });
  } else {
    _projects=JSON.parse(localStorage.getItem(LS.proj)||'[]');
    _tasks   =JSON.parse(localStorage.getItem(LS.task)||'[]');
  }
}
function setSyncDot(on){
  const d=document.getElementById('sync-dot');
  if(!d) return;
  d.textContent=on?'🔴 Live':'💾 Local';
  d.style.color=on?'var(--grn)':'var(--tx3)';
}
function onDataChange(){
  if(!currentUser) return;
  if(currentView==='tasks')       refreshTasks();
  if(currentView==='projs')       renderProjGrid();
  if(currentView==='proj-detail') renderProjDetail(currentProjId);
  if(currentView==='gestion')     renderGTaskList();
  if(currentView==='revision')    renderRevision();
  updateBanner();
}

/* ═══ THEME ═══ */
function toggleTheme(){
  document.body.classList.toggle('light');
  const isL=document.body.classList.contains('light');
  localStorage.setItem(LS.theme, isL?'light':'dark');
  document.getElementById('theme-btn').textContent=isL?'☀️':'🌙';
}
function applyTheme(){
  const t=localStorage.getItem(LS.theme);
  if(t==='light'){ document.body.classList.add('light'); document.getElementById('theme-btn').textContent='☀️'; }
}

/* ═══ AUTH ═══ */
function login(){
  const uid=document.getElementById('l-user').value;
  const pass=document.getElementById('l-pass').value;
  const u=USERS[uid];
  if(!u||u.pass!==pass){ document.getElementById('l-err').classList.add('show'); return; }
  document.getElementById('l-err').classList.remove('show');
  currentUser=u; localStorage.setItem(LS.user,uid);
  showApp();
}
function logout(){
  currentUser=null; localStorage.removeItem(LS.user);
  document.getElementById('screen-app').classList.add('hidden');
  document.getElementById('screen-login').style.display='flex';
  document.getElementById('l-pass').value='';
}
function showApp(){
  document.getElementById('screen-login').style.display='none';
  document.getElementById('screen-app').classList.remove('hidden');
  applyTheme();
  renderNav();
  navigate('tasks');
  setTimeout(showAlerts,700);
}

/* ═══ NAV ═══ */
function renderNav(){
  const u=currentUser, rm=ROLES[u.role];
  const av=document.getElementById('nav-av');
  av.textContent=u.ini; av.title=`${u.name} — Cerrar sesión`;
  av.style.cssText+=`;border-color:${rm.brd};background:${rm.bg};color:${rm.color};`;
  const isCeo=u.role==='ceo';
  document.getElementById('nav-links').innerHTML=`
    <button class="nav-link" onclick="navigate('tasks')">Mis Tareas</button>
    <button class="nav-link" onclick="navigate('projs')">Proyectos</button>
    ${isCeo?`<button class="nav-link" onclick="navigate('gestion')">Gestión</button>
             <button class="nav-link" onclick="navigate('revision')">Revisión</button>`:''}`;
}
function navigate(view, projId){
  currentView=view;
  if(projId) currentProjId=projId;
  ['tasks','projs','proj-detail','gestion','revision'].forEach(v=>{
    document.getElementById('view-'+v)?.classList.add('hidden');
  });
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('on'));
  const target=document.getElementById('view-'+view);
  if(target) target.classList.remove('hidden');
  // highlight nav
  const map={'tasks':0,'projs':1,'gestion':2,'revision':3};
  const idx=map[view];
  const links=document.querySelectorAll('.nav-link');
  if(idx!==undefined && links[idx]) links[idx].classList.add('on');

  if(view==='tasks')       { updateBanner(); refreshTasks(); }
  if(view==='projs')       { renderProjGrid(); }
  if(view==='proj-detail') { renderProjDetail(currentProjId); }
  if(view==='gestion')     { populateProjSels(); renderGTaskList(); }
  if(view==='revision')    { renderRevision(); }
}
function goBack(){ navigate('projs'); }

/* ═══ BANNER ═══ */
function updateBanner(){
  if(!currentUser) return;
  const rm=ROLES[currentUser.role];
  const av=document.getElementById('u-av');
  if(!av) return;
  av.textContent=currentUser.ini;
  av.style.cssText=`background:${rm.bg};color:${rm.color};border:2px solid ${rm.brd};`;
  document.getElementById('u-name').textContent=currentUser.name;
  document.getElementById('u-name').style.color=rm.color;
  document.getElementById('u-role').textContent=rm.label;
  const banner=document.getElementById('u-banner');
  banner.style.background=rm.bg; banner.style.borderColor=rm.brd;
  const pend=myTasks().filter(t=>t.status!=='done').length;
  document.getElementById('u-pend').textContent=pend;
  document.getElementById('u-pend').style.color=rm.color;
  // set accent
  document.documentElement.style.setProperty('--accent',rm.color);
  document.documentElement.style.setProperty('--ac2',rm.bg);
  document.documentElement.style.setProperty('--ac3',rm.brd);
}

/* ═══ DASHBOARD ═══ */
function myTasks(){
  return _tasks.filter(t=>Array.isArray(t.assignedUsers)&&t.assignedUsers.includes(currentUser.id));
}
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function weekRange(){
  const now=new Date(), day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:mon.toISOString().split('T')[0], end:sun.toISOString().split('T')[0]};
}

function refreshTasks(){
  const active=document.querySelector('.stab.on');
  const w=active?.getAttribute('onclick').match(/'(\w+)'/)?.[1]||'hoy';
  if(w==='semana') renderSemana();
  else if(w==='prioridad') renderPrioridad();
  else renderHoy();
}
function stab(t,btn){
  ['hoy','semana','prioridad'].forEach(v=>document.getElementById('v-'+v)?.classList.add('hidden'));
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('on'));
  document.getElementById('v-'+t)?.classList.remove('hidden');
  btn.classList.add('on');
  if(t==='hoy') renderHoy();
  else if(t==='semana') renderSemana();
  else renderPrioridad();
}

function renderHoy(){
  const today=todayStr();
  const over=myTasks().filter(t=>t.dueDate&&t.dueDate<today&&t.status!=='done');
  const tod =myTasks().filter(t=>t.dueDate===today);
  const noD =myTasks().filter(t=>!t.dueDate&&t.status!=='done');
  let h='';
  if(over.length){ h+=`<div class="sec-lbl" style="color:var(--red);">⚠️ Vencidas (${over.length})</div>`+over.map(t=>taskCardHTML(t,'overdue-c')).join('');}
  if(tod.length){  h+=`<div class="sec-lbl">📅 Hoy</div>`+tod.map(t=>taskCardHTML(t,'today-c')).join('');}
  if(noD.length){  h+=`<div class="sec-lbl">🗂 Sin fecha</div>`+noD.map(t=>taskCardHTML(t,'')).join('');}
  if(!h) h='<div class="empty"><div class="empty-ico">🎉</div><p>Sin tareas para hoy</p></div>';
  document.getElementById('v-hoy').innerHTML=h;
}
function renderSemana(){
  const wr=weekRange(); const today=todayStr();
  const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const mon=new Date(wr.start); let h='';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const dStr=d.toISOString().split('T')[0];
    const dt=myTasks().filter(t=>t.dueDate===dStr);
    const isT=dStr===today;
    h+=`<div class="sec-lbl" style="${isT?'color:var(--accent);':''}">${isT?'📍 ':''}${days[i]} ${d.getDate()}/${d.getMonth()+1}${dt.length?` · ${dt.length}`:''}</div>`;
    h+=dt.length?dt.map(t=>taskCardHTML(t,dStr<today&&t.status!=='done'?'overdue-c':'')).join(''):`<div class="txt-xs txt-muted" style="padding:4px 2px 10px;">Sin tareas</div>`;
  }
  const noD=myTasks().filter(t=>!t.dueDate&&t.status!=='done');
  if(noD.length) h+=`<div class="sec-lbl">🗂 Sin fecha</div>`+noD.map(t=>taskCardHTML(t,'')).join('');
  document.getElementById('v-semana').innerHTML=h||'<div class="empty"><div class="empty-ico">✅</div><p>Sin tareas esta semana</p></div>';
}
function renderPrioridad(){
  let h='';
  ['alta','media','baja'].forEach(p=>{
    const pts=myTasks().filter(t=>t.priority===p);
    if(!pts.length) return;
    h+=`<div class="sec-lbl">${p==='alta'?'🔴':p==='media'?'🟡':'🟢'} ${PRIOS[p].label} (${pts.length})</div>`+pts.map(t=>taskCardHTML(t,'')).join('');
  });

}

function renderMethContent(id, meth){
  const el=document.getElementById('meth-content');

/* ── Lista ── */
function renderListaHTML(projId){
  const tasks=_tasks.filter(t=>t.projectId===projId);
  if(!tasks.length) return '<div class="empty"><div class="empty-ico">📋</div><p>Sin tareas en este proyecto</p></div>';
  const pend=tasks.filter(t=>t.status!=='done');
  const done=tasks.filter(t=>t.status==='done');
  let h='';
  if(pend.length) h+=`<div class="sec-lbl">Pendientes (${pend.length})</div>`+pend.map(t=>taskCardHTML(t,'')).join('');
  if(done.length) h+=`<div class="sec-lbl">Completadas (${done.length})</div>`+done.map(t=>taskCardHTML(t,'')).join('');
  return h;
}

/* ── Kanban ── */
function renderKanbanHTML(projId){
  const tasks=_tasks.filter(t=>t.projectId===projId);
  const cols=KB_COLS.map(col=>{
    const colTasks=tasks.filter(t=>(t.kStatus||'investigacion')===col.id);

      const am=AREAS[t.area]||AREAS.general;
      const pm=PRIOS[t.priority]||PRIOS.media;

      return `<div class="kb-card ${done?'done-c':''}" id="kc-${t.id}" draggable="true"
        ondragstart="kbDragStart(event,'${t.id}')" ondragend="kbDragEnd(event)">
        <div class="flex" style="justify-content:space-between;margin-bottom:4px;">

            <button class="btn-icon" style="width:22px;height:22px;" onclick="openEditTask('${t.id}')">✏️</button>
            <button class="btn-icon btn-del" style="width:22px;height:22px;" onclick="deleteTask('${t.id}')">✕</button>

        </div>

        <div class="kb-chips">
          <span class="bdg ${am.cls}">${am.icon}</span>
          <span class="bdg ${pm.cls}">${pm.label}</span>
          <div class="flex" style="gap:2px;">${dots}</div>
        </div>
        <select class="kb-move" onchange="moveKbTask('${t.id}',this.value);this.value=''">
          <option value="">Mover a…</option>${mBtns}
        </select>
      </div>`;
    }).join('');
    return `<div class="kanban-col">
      <div class="kb-hdr"><span class="bdg ${col.cls}">${col.icon} ${col.label}</span><span class="kb-count">${colTasks.length}</span></div>
      <div class="kb-body" id="kb-${col.id}"

/* ── Kanban DnD ── */
function kbDragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{ const el=document.getElementById('kc-'+id); if(el) el.classList.add('dragging'); },0);
}
function kbDragEnd(e){
  if(dragId){ const el=document.getElementById('kc-'+dragId); if(el) el.classList.remove('dragging'); }
}
function kbDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function kbDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
async function kbDrop(e,colId){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  const t=_tasks.find(x=>x.id===dragId); if(!t) return;
  t.kStatus=colId;
  t.status=colId==='cierre'?'done':'pending';
  await persistTask(t);
  if(!_fbOn) renderProjDetail(currentProjId);
}
async function moveKbTask(taskId,colId){
  const t=_tasks.find(x=>x.id===taskId); if(!t) return;
  t.kStatus=colId; t.status=colId==='cierre'?'done':'pending';
  await persistTask(t);
  if(!_fbOn) renderProjDetail(currentProjId);
}

/* ── Calendar ── */
function renderCalHTML(projId){
  const today=todayStr();
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay =new Date(calYear,calMonth+1,0);
  const startWd =firstDay.getDay();
  let h=`<div class="cal-nav">
    <button class="btn btn-g btn-sm" onclick="calNav(-1,'${projId}')">←</button>
    <div class="cal-month">${MONTHS[calMonth]} ${calYear}</div>
    <button class="btn btn-g btn-sm" onclick="calNav(1,'${projId}')">→</button>
  </div>
  <div class="cal-grid">
    ${DAYS.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}`;
  // empty cells before first day
  for(let i=0;i<startWd;i++) h+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dStr===today;
    const dayTasks=_tasks.filter(t=>t.projectId===projId&&t.dueDate===dStr);
    const chips=dayTasks.map(t=>{
      const am=AREAS[t.area]||AREAS.general;
      const color=am.cls==='bo'?'var(--org)':am.cls==='bb'?'var(--blu)':am.cls==='bg'?'var(--grn)':am.cls==='bp'?'var(--pur)':'var(--tx3)';
      return `<div class="cal-task-chip ${t.status==='done'?'done-c':''}" style="background:${color}22;color:${color};border:1px solid ${color}44;" onclick="openEditTask('${t.id}')" title="${esc(t.name)}">${esc(t.name)}</div>`;
    }).join('');
    h+=`<div class="cal-cell ${isToday?'today':''}">
      <div class="cal-date ${isToday?'is-today':''}">${d}</div>
      ${chips}
    </div>`;
  }
  h+=`</div>`;
  // tasks without date
  const noDate=_tasks.filter(t=>t.projectId===projId&&!t.dueDate&&t.status!=='done');
  if(noDate.length){
    h+=`<div class="cal-no-date">
      <div class="sec-lbl" style="margin-top:0;">Sin fecha</div>
      ${noDate.map(t=>taskCardHTML(t,'')).join('')}
    </div>`;
  }
  return h;
}
function calNav(dir, projId){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0) {calMonth=11;calYear--;}
  renderMethContent(projId,'calendario');
}

/* ═══ CRUD — PROJECTS ═══ */
function openNewProj(){
  clearProjForm();
  document.getElementById('mp-ttl').textContent='Nuevo Proyecto';
  openMod('m-proj');
}
function openEditProj(id){
  const p=_projects.find(x=>x.id===id); if(!p) return;
  document.getElementById('mp-id').value  =p.id;
  document.getElementById('mp-name').value=p.name;
  document.getElementById('mp-desc').value=p.desc||'';
  document.getElementById('mp-area').value=p.area||'marketing';
  document.getElementById('mp-meth').value=p.meth||'lista';
  document.getElementById('mp-type').value=p.type||'once';
  document.getElementById('mp-cycle').value=p.cycle||'weekly';
  document.getElementById('mp-icon').value=p.icon||'';
  document.getElementById('mp-cycle-w').style.display=p.type==='cyclic'?'block':'none';
  const team=p.team||[];
  document.querySelectorAll('#mp-assign .a-chip').forEach(c=>{
    c.classList.toggle('sel',team.includes(c.querySelector('input').value));
  });
  document.getElementById('mp-ttl').textContent='Editar Proyecto';
  openMod('m-proj');
}
async function saveProject(){
  const name=document.getElementById('mp-name').value.trim();
  if(!name) return alert('Nombre requerido.');
  const id=document.getElementById('mp-id').value||uid();
  const cyclic=document.getElementById('mp-type').value==='cyclic';
  const team=[...document.querySelectorAll('#mp-assign .a-chip.sel')].map(c=>c.querySelector('input').value);
  const proj={
    id, name,
    desc: document.getElementById('mp-desc').value.trim(),
    area: document.getElementById('mp-area').value,
    meth: document.getElementById('mp-meth').value,
    type: document.getElementById('mp-type').value,
    cycle:cyclic?document.getElementById('mp-cycle').value:null,
    icon: document.getElementById('mp-icon').value||'📁',
    team,
    status:_projects.find(p=>p.id===id)?.status||'active',
    createdAt:_projects.find(p=>p.id===id)?.createdAt||Date.now(),
  };
  await persistProject(proj);
  closeMod('m-proj'); clearProjForm();
  if(!_fbOn){ renderProjGrid(); populateProjSels(); }
}
function clearProjForm(){
  ['mp-id','mp-name','mp-desc','mp-icon'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('mp-area').value='marketing';
  document.getElementById('mp-meth').value='lista';
  document.getElementById('mp-type').value='once';
  document.getElementById('mp-cycle-w').style.display='none';
  document.querySelectorAll('#mp-assign .a-chip').forEach(c=>c.classList.remove('sel'));
}
async function deleteProject(id){
  if(!confirm('¿Eliminar proyecto y sus tareas?')) return;
  await removeProject(id);
  if(!_fbOn){ renderProjGrid(); populateProjSels(); }
}

/* ═══ CRUD — TASKS ═══ */
function openNewTaskForProj(projId){
  navigate('gestion');
  setTimeout(()=>{ const sel=document.getElementById('g-proj'); if(sel) sel.value=projId; },100);
}
async function createTask(){
  const projId=document.getElementById('g-proj').value;
  const name=document.getElementById('g-name').value.trim();
  if(!projId) return alert('Selecciona proyecto.');
  if(!name)   return alert('Nombre requerido.');
  const assigned=[...document.querySelectorAll('#g-assign .a-chip.sel')].map(c=>c.querySelector('input').value);
  const t={
    id:uid(), projectId:projId, name,
    desc:document.getElementById('g-desc').value.trim(),
    area:document.getElementById('g-area').value,
    priority:document.getElementById('g-prio').value,
    dueDate:document.getElementById('g-due').value,
    assignedUsers:assigned,
    kStatus:'investigacion',
    status:'pending', createdAt:Date.now(),
  };
  await persistTask(t);
  document.getElementById('g-name').value='';
  document.getElementById('g-desc').value='';
  document.getElementById('g-due').value='';
  document.querySelectorAll('#g-assign .a-chip').forEach(c=>c.classList.remove('sel'));
  if(!_fbOn) renderGTaskList();
}

function openEditTask(id){
  const t=_tasks.find(x=>x.id===id); if(!t) return;
  const proj=_projects.find(p=>p.id===t.projectId);
  document.getElementById('et-id').value   =t.id;
  document.getElementById('et-name').value =t.name;
  document.getElementById('et-desc').value =t.desc||'';
  document.getElementById('et-area').value =t.area||'general';
  document.getElementById('et-prio').value =t.priority||'media';
  document.getElementById('et-due').value  =t.dueDate||'';
  document.getElementById('et-kstatus').value=t.kStatus||'investigacion';
  populateProjSels('et-proj', t.projectId);
  document.querySelectorAll('#et-assign .a-chip').forEach(c=>{
    c.classList.toggle('sel',(t.assignedUsers||[]).includes(c.querySelector('input').value));
  });
  const showKS=proj?.meth==='kanban';
  document.getElementById('et-kstatus-wrap').style.display=showKS?'block':'none';
  openMod('m-task');
}
async function saveTask(){
  const id=document.getElementById('et-id').value;
  const t=_tasks.find(x=>x.id===id); if(!t) return;
  const assigned=[...document.querySelectorAll('#et-assign .a-chip.sel')].map(c=>c.querySelector('input').value);
  Object.assign(t,{
    name:    document.getElementById('et-name').value.trim(),
    desc:    document.getElementById('et-desc').value.trim(),
    area:    document.getElementById('et-area').value,
    priority:document.getElementById('et-prio').value,
    dueDate: document.getElementById('et-due').value,
    projectId:document.getElementById('et-proj').value,
    assignedUsers:assigned,
    kStatus: document.getElementById('et-kstatus').value,
  });
  if(t.kStatus==='cierre') t.status='done';
  await persistTask(t);
  closeMod('m-task');
  if(!_fbOn) onDataChange();
}
async function toggleTask(id){
  const t=_tasks.find(x=>x.id===id); if(!t) return;
  t.status=t.status==='done'?'pending':'done';
  if(t.status==='done') t.kStatus='cierre';
  if(t.status==='pending'&&t.kStatus==='cierre') t.kStatus='ejecucion';
  await persistTask(t);
  if(!_fbOn) onDataChange();
}
async function deleteTask(id){
  await removeTask(id);
  if(!_fbOn) onDataChange();
}

/* ═══ HELPERS ═══ */
function toggleChip(chip){ chip.classList.toggle('sel'); }
function populateProjSels(targetId, selectedId){
  const ids=targetId?[targetId]:['g-proj','et-proj'];
  ids.forEach(sid=>{
    const sel=document.getElementById(sid); if(!sel) return;
    sel.innerHTML=_projects.length
      ?_projects.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.icon||'📁'} ${esc(p.name)}</option>`).join('')
      :'<option value="">— Sin proyectos —</option>';
  });
}
function openMod(id){ document.getElementById(id)?.classList.add('open'); }
function closeMod(id){ document.getElementById(id)?.classList.remove('open'); }
document.querySelectorAll('.mov').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }));
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══ WINDOW EXPORTS ═══ */
Object.assign(window,{
  login,logout,navigate,goBack,toggleTheme,stab,
  openMod,closeMod,
  openNewProj,openEditProj,saveProject,deleteProject,
  createTask,openEditTask,saveTask,deleteTask,toggleTask,
  openNewTaskForProj,renderGTaskList,
  setMeth,calNav,kbDragStart,kbDragEnd,kbDragOver,kbDragLeave,kbDrop,moveKbTask,
  toggleChip,
});

/* ═══ INIT ═══ */
(async()=>{
  applyTheme();
  await initData();
  const saved=localStorage.getItem(LS.user);
  if(saved&&USERS[saved]){ currentUser=USERS[saved]; showApp(); }
})();
</script>
