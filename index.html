<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FCNOISE — Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1218; --bg2:#151a21; --bg3:#1c2028; --bd:rgba(255,255,255,.09);
  --tx:#f2f2f5; --tx2:#c7c7cc; --tx3:#8e8e93;
  --orange:#ff7a00; --blu:#3b82f6;
  --font-display:'Bebas Neue','Impact',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,122,0,.08),transparent 60%),var(--bg);color:var(--tx);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.brand{font-family:var(--font-display);font-size:clamp(38px,9vw,68px);letter-spacing:.02em;line-height:1;margin-bottom:6px;}
.brand em{color:var(--orange);font-style:normal;}
.sub{font-size:12px;letter-spacing:.28em;color:var(--tx3);text-transform:uppercase;margin-bottom:38px;text-align:center;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:100%;max-width:760px;}
.card{position:relative;display:block;text-decoration:none;color:inherit;background:linear-gradient(165deg,rgba(30,34,42,.85),rgba(18,22,30,.7));border:1px solid var(--bd);border-radius:20px;padding:26px 24px 24px;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden;cursor:pointer;box-shadow:0 4px 30px rgba(0,0,0,.4);}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18);box-shadow:0 12px 44px rgba(0,0,0,.55);}
.card-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;}
.card-ttl{font-family:var(--font-display);font-size:26px;letter-spacing:.03em;margin-bottom:6px;}
.card-desc{font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:18px;min-height:40px;}
.card-go{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.card-go .arw{transition:transform .18s;}
.card:hover .card-go .arw{transform:translateX(4px);}
.card.fcn .card-ico{background:rgba(255,122,0,.14);color:var(--orange);}
.card.fcn .card-go{color:var(--orange);}
.card.spo .card-ico{background:rgba(59,130,246,.14);color:var(--blu);}
.card.spo .card-go{color:var(--blu);}
.foot{margin-top:34px;font-size:10px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="brand">FC<em>NOISE</em></div>
  <div class="sub">Base de Proyectos</div>

  <div class="grid">
    <a class="card fcn" href="./portal.html">
      <div class="card-ico">⚽</div>
      <div class="card-ttl">Project FCNOISE</div>
      <div class="card-desc">El portal interno: proyectos, tareas, contenido, pulse y repositorios.</div>
      <div class="card-go">Abrir portal <span class="arw">→</span></div>
    </a>

    <a class="card spo" href="./sponsor.html">
      <div class="card-ico">🤝</div>
      <div class="card-ttl">Sponsor</div>
      <div class="card-desc">Tablero de métricas para sponsors: alcance semanal, publicaciones y evolución mes a mes.</div>
      <div class="card-go">Abrir <span class="arw">→</span></div>
    </a>
  </div>

  <div class="foot">FCnoise · Est. 2025</div>
</body>
</html>
