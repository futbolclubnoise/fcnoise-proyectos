<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FCNOISE — Proyectos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0c0c;--bg2:#111;--bg3:#181818;--bg4:#202020;--bg5:#2a2a2a;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.13);--bd3:rgba(255,255,255,.22);
  --tx:#fff;--tx2:#e8e8e8;--tx3:#aaa;
  --card:#161616;--inp:#1e1e1e;
  --red:#e03c3c;--red2:rgba(224,60,60,.15);--red3:rgba(224,60,60,.3);
  --grn:#3aaa6a;--grn2:rgba(58,170,106,.15);--grn3:rgba(58,170,106,.3);
  --org:#e07c2a;--org2:rgba(224,124,42,.15);--org3:rgba(224,124,42,.3);
  --blu:#4a9eff;--blu2:rgba(74,158,255,.15);--blu3:rgba(74,158,255,.3);
  --pur:#a06ee0;--pur2:rgba(160,110,224,.15);--pur3:rgba(160,110,224,.3);
  --yel:#f0c040;--yel2:rgba(240,192,64,.15);--yel3:rgba(240,192,64,.3);
  --r:10px;
  --accent:#e07c2a;--accent2:rgba(224,124,42,.15);--accent3:rgba(224,124,42,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;}

/* ── BAND ── */
.band{height:28px;background:#000;border-bottom:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;}
.band-txt{font-size:9px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--tx3);}

/* ── LOGIN ── */
#screen-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:var(--bg);}
.login-logo{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.login-logo span{color:var(--org);}
.login-sub{font-size:12px;color:var(--tx3);margin-bottom:36px;letter-spacing:.5px;}
.login-box{width:100%;max-width:360px;background:var(--bg3);border:1px solid var(--bd2);border-radius:16px;padding:28px 24px;}
.login-box h2{font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px;color:var(--tx2);}
.fi{margin-bottom:14px;}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
.fi input,.fi select,.fi textarea{width:100%;padding:10px 13px;background:var(--inp);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);font-family:'Poppins',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--accent);}
.fi select option{background:var(--bg3);}
.fi textarea{resize:vertical;min-height:68px;}
.login-err{font-size:11px;color:var(--red);margin-bottom:12px;padding:8px 12px;background:var(--red2);border-radius:8px;display:none;}
.login-err.show{display:block;}
.btn{padding:10px 18px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.85;}
.btn-ghost{background:var(--bg4);color:var(--tx2);border:1px solid var(--bd2);}
.btn-ghost:hover{background:var(--bg5);}
.btn-sm{padding:6px 13px;font-size:11px;}
.btn-xs{padding:4px 10px;font-size:10px;}
.btn-icon{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--bg4);border:1px solid var(--bd2);color:var(--tx3);cursor:pointer;font-size:12px;transition:all .2s;flex-shrink:0;}
.btn-icon:hover{background:var(--bg5);color:var(--tx);}
.btn-danger{background:var(--red2);color:var(--red);border:1px solid var(--red3);}
.w-full{width:100%;}

/* ── NAV ── */
.nav{height:52px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100;}
.nav-brand{font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.nav-brand span{color:var(--org);}
.nav-right{display:flex;align-items:center;gap:10px;}
.sync-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--tx3);letter-spacing:.3px;}
.user-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--accent3);background:var(--accent2);color:var(--accent);cursor:pointer;flex-shrink:0;}
.role-pill{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

/* ── TABS ── */
.tabs-row{display:flex;gap:3px;background:var(--bg3);padding:3px;border-radius:var(--r);margin-bottom:18px;}
.tab-btn{flex:1;padding:7px 0;border:none;background:transparent;color:var(--tx3);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border-radius:7px;transition:all .2s;white-space:nowrap;}
.tab-btn.on{background:var(--tx);color:var(--bg);}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;}
.sub-tab{padding:5px 14px;border:1px solid var(--bd2);border-radius:20px;font-size:11px;font-weight:600;color:var(--tx3);cursor:pointer;background:transparent;transition:all .2s;font-family:'Poppins',sans-serif;}
.sub-tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── BODY ── */
.app-body{padding:18px;max-width:860px;margin:0 auto;}

/* ── USER BANNER ── */
.user-banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);margin-bottom:18px;border:1px solid;}
.ub-av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
.ub-name{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.ub-role{font-size:10px;margin-top:2px;}
.ub-stat{margin-left:auto;text-align:right;}
.ub-num{font-size:20px;font-weight:700;}
.ub-lbl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;}

/* ── SECTION LABEL ── */
.sec-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin:18px 0 8px;padding-left:2px;}
.sec-lbl:first-child{margin-top:0;}

/* ── TASK CARD ── */
.task-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;transition:all .2s;}
.task-card:hover{border-color:var(--bd2);background:var(--bg4);}
.task-card.done-card{opacity:.55;}
.tc-top{display:flex;align-items:flex-start;gap:10px;}
.tc-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--bd3);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px;}
.tc-check.done{background:var(--grn);border-color:var(--grn);}
.tc-check svg{width:10px;height:10px;color:#fff;opacity:0;transition:opacity .2s;}
.tc-check.done svg{opacity:1;}
.tc-body{flex:1;min-width:0;}
.tc-name{font-size:13px;font-weight:600;color:var(--tx);}
.tc-name.done{text-decoration:line-through;color:var(--tx3);}
.tc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px;}
.tc-proj{font-size:10px;color:var(--tx3);}
.tc-actions{display:flex;gap:5px;align-items:flex-start;flex-shrink:0;}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.bdg-red{background:var(--red2);color:var(--red);border:1px solid var(--red3);}
.bdg-org{background:var(--org2);color:var(--org);border:1px solid var(--org3);}
.bdg-grn{background:var(--grn2);color:var(--grn);border:1px solid var(--grn3);}
.bdg-blu{background:var(--blu2);color:var(--blu);border:1px solid var(--blu3);}
.bdg-pur{background:var(--pur2);color:var(--pur);border:1px solid var(--pur3);}
.bdg-yel{background:var(--yel2);color:var(--yel);border:1px solid var(--yel3);}
.bdg-grey{background:var(--bg5);color:var(--tx3);border:1px solid var(--bd2);}
.user-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:1px solid var(--bd2);flex-shrink:0;}
.overdue{border-left:3px solid var(--red);}
.due-today{border-left:3px solid var(--org);}

/* ── PROJECT CARD ── */
.proj-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s;}
.proj-card:hover{border-color:var(--bd2);background:var(--bg4);}
.proj-card.expanded{border-color:var(--accent);background:var(--bg4);}
.pc-top{display:flex;align-items:center;gap:12px;}
.pc-icon{width:36px;height:36px;border-radius:8px;background:var(--accent2);border:1px solid var(--accent3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.pc-info{flex:1;min-width:0;}
.pc-name{font-size:13px;font-weight:700;}
.pc-desc{font-size:10px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog-bg{height:5px;background:var(--bg5);border-radius:4px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s;}
.task-inlist{padding-top:10px;border-top:1px solid var(--bd);margin-top:10px;}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-box{background:var(--bg4);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:center;}
.stat-n{font-size:22px;font-weight:700;color:var(--accent);}
.stat-l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* ── PANEL ── */
.panel{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);}

/* ── REVIEW TABLE ── */
.rev-tbl{width:100%;border-collapse:collapse;}
.rev-tbl th{text-align:left;padding:7px 10px;font-size:9px;color:var(--tx3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--bd2);}
.rev-tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle;}
.rev-tbl tr:last-child td{border-bottom:none;}
.rev-tbl tr:hover td{background:var(--bg4);}

/* ── MULTI-ASSIGN CHECKBOXES ── */
.assign-grid{display:flex;flex-wrap:wrap;gap:7px;}
.assign-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--bd2);background:var(--bg4);cursor:pointer;transition:all .2s;font-size:11px;font-weight:600;color:var(--tx2);user-select:none;}
.assign-chip input{display:none;}
.assign-chip.selected{border-color:var(--accent);background:var(--accent2);color:var(--accent);}

/* ── FORM ROW ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg3);border:1px solid var(--bd2);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;transform:translateY(8px);transition:transform .2s;}
.modal-ov.open .modal{transform:translateY(0);}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.modal-close{width:26px;height:26px;border:none;background:var(--bg5);border-radius:6px;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}

/* ── ALERT POPUP ── */
#modal-alert .modal{border-color:var(--org3);max-width:420px;}
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);}
.alert-item:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}

/* ── EMPTY ── */
.empty{text-align:center;padding:36px 20px;color:var(--tx3);}
.empty-icon{font-size:30px;margin-bottom:8px;}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--bd);margin:14px 0;}
.hidden{display:none!important;}
.ml-auto{margin-left:auto;}
.flex{display:flex;align-items:center;}
.gap-6{gap:6px;}
.gap-10{gap:10px;}
.txt-xs{font-size:10px;}
.txt-muted{color:var(--tx3);}
</style>
</head>
<body>

<div class="band"><div class="band-txt">FCNOISE — GESTIÓN DE PROYECTOS</div></div>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="screen-login">
  <div class="login-logo">FC<span>NOISE</span></div>
  <div class="login-sub">Gestión de Proyectos Internos</div>
  <div class="login-box">
    <h2>Iniciar sesión</h2>
    <div class="fi">
      <label>Usuario</label>
      <select id="login-user">
        <option value="">Selecciona usuario…</option>
        <option value="leonardo">Leonardo</option>
        <option value="veronica">Verónica</option>
        <option value="laura">Laura</option>
        <option value="editor">Editor</option>
      </select>
    </div>
    <div class="fi">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="login-err" id="login-err">Usuario o contraseña incorrectos</div>
    <button class="btn btn-primary w-full" onclick="login()">Entrar</button>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="screen-app" class="hidden">

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-brand">FC<span>NOISE</span></div>
    <div class="nav-right">
      <div class="sync-badge" id="sync-badge">💾 Local</div>
      <div class="role-pill" id="nav-role-pill"></div>
      <div class="user-av" id="nav-av" title="Cerrar sesión" onclick="logout()"></div>
    </div>
  </nav>

  <div class="app-body">

    <!-- USER BANNER -->
    <div class="user-banner" id="user-banner">
      <div class="ub-av" id="ub-av"></div>
      <div>
        <div class="ub-name" id="ub-name"></div>
        <div class="ub-role txt-muted" id="ub-role"></div>
      </div>
      <div class="ub-stat ml-auto">
        <div class="ub-num" id="ub-pending">0</div>
        <div class="ub-lbl">pendientes</div>
      </div>
    </div>

    <!-- TABS (CEO has extra tabs) -->
    <div class="tabs-row" id="main-tabs"></div>

    <!-- ── MIS TAREAS ── -->
    <div id="view-tasks" class="hidden">
      <div class="sub-tabs">
        <button class="sub-tab on" onclick="subTab('hoy',this)">Hoy</button>
        <button class="sub-tab" onclick="subTab('semana',this)">Semana</button>
        <button class="sub-tab" onclick="subTab('prioridad',this)">Prioridad</button>
      </div>
      <div id="view-hoy"></div>
      <div id="view-semana" class="hidden"></div>
      <div id="view-prioridad" class="hidden"></div>
    </div>

    <!-- ── GESTIÓN (CEO) ── -->
    <div id="view-gestion" class="hidden">
      <div class="panel">
        <div class="panel-hdr">
          <span class="panel-title">Proyectos</span>
          <button class="btn btn-primary btn-sm" onclick="openModal('modal-proj')">+ Proyecto</button>
        </div>
        <div id="gestion-proyectos"></div>
      </div>
      <div class="panel">
        <div class="panel-hdr">
          <span class="panel-title">Nueva Tarea</span>
        </div>
        <div class="fi">
          <label>Proyecto</label>
          <select id="t-proj"></select>
        </div>
        <div class="fi">
          <label>Nombre</label>
          <input type="text" id="t-name" placeholder="Ej. Publicación IG Lunes">
        </div>
        <div class="fi">
          <label>Descripción</label>
          <textarea id="t-desc" placeholder="Detalles, links, referencias…"></textarea>
        </div>
        <div class="form-row">
          <div class="fi">
            <label>Área</label>
            <select id="t-area">
              <option value="marketing">📣 Marketing</option>
              <option value="estrategia">📊 Estrategia</option>
              <option value="operaciones">⚡ Operaciones</option>
              <option value="diseno">🎨 Diseño</option>
              <option value="general">💼 General</option>
            </select>
          </div>
          <div class="fi">
            <label>Prioridad</label>
            <select id="t-prio">
              <option value="alta">🔴 Alta</option>
              <option value="media">🟡 Media</option>
              <option value="baja">🟢 Baja</option>
            </select>
          </div>
        </div>
        <div class="fi">
          <label>Asignar a</label>
          <div class="assign-grid" id="assign-grid">
            <label class="assign-chip" onclick="toggleAssign(this,'leonardo')"><input type="checkbox" value="leonardo">LE Leonardo</label>
            <label class="assign-chip" onclick="toggleAssign(this,'veronica')"><input type="checkbox" value="veronica">VE Verónica</label>
            <label class="assign-chip" onclick="toggleAssign(this,'laura')"><input type="checkbox" value="laura">LA Laura</label>
            <label class="assign-chip" onclick="toggleAssign(this,'editor')"><input type="checkbox" value="editor">ED Editor</label>
          </div>
        </div>
        <div class="form-row">
          <div class="fi">
            <label>Fecha límite</label>
            <input type="date" id="t-due">
          </div>
          <div class="fi" style="align-self:end;">
            <button class="btn btn-primary w-full" onclick="createTask()">Crear Tarea</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hdr">
          <span class="panel-title">Todas las Tareas</span>
          <div class="flex gap-6">
            <select id="filter-user" onchange="renderGestionTasks()" style="padding:5px 9px;font-size:10px;background:var(--bg4);border:1px solid var(--bd2);border-radius:7px;color:var(--tx);font-family:Poppins,sans-serif;">
              <option value="all">Todos</option>
              <option value="leonardo">Leonardo</option>
              <option value="veronica">Verónica</option>
              <option value="laura">Laura</option>
              <option value="editor">Editor</option>
            </select>
            <select id="filter-area" onchange="renderGestionTasks()" style="padding:5px 9px;font-size:10px;background:var(--bg4);border:1px solid var(--bd2);border-radius:7px;color:var(--tx);font-family:Poppins,sans-serif;">
              <option value="all">Todas las áreas</option>
              <option value="marketing">Marketing</option>
              <option value="estrategia">Estrategia</option>
              <option value="operaciones">Operaciones</option>
              <option value="diseno">Diseño</option>
              <option value="general">General</option>
            </select>
          </div>
        </div>
        <div id="gestion-tasks"></div>
      </div>
    </div>

    <!-- ── REVISIÓN (CEO) ── -->
    <div id="view-revision" class="hidden">
      <div class="stats-row" id="rev-stats"></div>
      <div class="panel">
        <div class="panel-hdr"><span class="panel-title">Proyectos vs Ejecución</span></div>
        <div id="rev-table"></div>
      </div>
      <div class="panel">
        <div class="panel-hdr"><span class="panel-title">Carga por Usuario</span></div>
        <div id="rev-users"></div>
      </div>
    </div>

  </div><!-- /app-body -->
</div><!-- /screen-app -->

<!-- ═══════════ MODAL: ALERT ═══════════ -->
<div class="modal-ov" id="modal-alert">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">⚠️ Tareas Urgentes</span>
      <button class="modal-close" onclick="closeModal('modal-alert')">✕</button>
    </div>
    <div id="alert-list"></div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary w-full" onclick="closeModal('modal-alert')">Entendido</button>
    </div>
  </div>
</div>

<!-- ═══════════ MODAL: PROYECTO ═══════════ -->
<div class="modal-ov" id="modal-proj">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-proj-title">Nuevo Proyecto</span>
      <button class="modal-close" onclick="closeModal('modal-proj')">✕</button>
    </div>

<script type="module">
import { firebaseInit, isConnected, listenProjects, listenTasks, fbSaveProject, fbDeleteProject, fbSaveTask, fbDeleteTask } from './firebase.js';

/* ═══════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════ */
const USERS = {
  leonardo: { id:'leonardo', name:'Leonardo', initials:'LE', pass:'123456', role:'ceo' },
  veronica: { id:'veronica', name:'Verónica',  initials:'VE', pass:'123456', role:'estratega' },
  laura:    { id:'laura',    name:'Laura',     initials:'LA', pass:'123456', role:'asistente' },
  editor:   { id:'editor',   name:'Editor',    initials:'ED', pass:'123456', role:'diseno' },
};

const ROLE_META = {
  ceo:       { label:'CEO',       color:'var(--org)',  bg:'var(--org2)',  border:'var(--org3)'  },
  estratega: { label:'Estratega', color:'var(--blu)',  bg:'var(--blu2)',  border:'var(--blu3)'  },
  asistente: { label:'Asistente', color:'var(--grn)',  bg:'var(--grn2)',  border:'var(--grn3)'  },
  diseno:    { label:'Diseño',    color:'var(--pur)',  bg:'var(--pur2)',  border:'var(--pur3)'  },
};

const AREA_META = {
  marketing:   { label:'Marketing',   icon:'📣', cls:'bdg-org' },
  estrategia:  { label:'Estrategia',  icon:'📊', cls:'bdg-blu' },
  operaciones: { label:'Operaciones', icon:'⚡', cls:'bdg-grn' },
  diseno:      { label:'Diseño',      icon:'🎨', cls:'bdg-pur' },
  general:     { label:'General',     icon:'💼', cls:'bdg-grey' },
};

const PRIO_META = {
  alta:  { label:'Alta',  cls:'bdg-red' },
  media: { label:'Media', cls:'bdg-yel' },
  baja:  { label:'Baja',  cls:'bdg-grn' },
};

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let currentUser = null;
let _projects   = [];
let _tasks      = [];
let _fbOn       = false;

const LS_PROJ  = 'fcn_projects';
const LS_TASK  = 'fcn_tasks';
const LS_USER  = 'fcn_session';

/* ═══════════════════════════════════════
   DATA LAYER
═══════════════════════════════════════ */
function loadProjects(){ return _projects; }
function loadTasks()   { return _tasks; }

function saveProjects(d){ _projects = d; localStorage.setItem(LS_PROJ, JSON.stringify(d)); }
function saveTasks(d)   { _tasks = d;    localStorage.setItem(LS_TASK, JSON.stringify(d)); }

async function persistProject(p){
  saveProjects([..._projects.filter(x=>x.id!==p.id), p].sort((a,b)=>a.createdAt-b.createdAt));
  if(_fbOn) await fbSaveProject(p);
}
async function persistTask(t){
  saveTasks([..._tasks.filter(x=>x.id!==t.id), t].sort((a,b)=>a.createdAt-b.createdAt));
  if(_fbOn) await fbSaveTask(t);
}
async function removeProject(id){
  saveProjects(_projects.filter(p=>p.id!==id));
  saveTasks(_tasks.filter(t=>t.projectId!==id));
  if(_fbOn){ await fbDeleteProject(id); }
}
async function removeTask(id){
  saveTasks(_tasks.filter(t=>t.id!==id));
  if(_fbOn) await fbDeleteTask(id);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ═══════════════════════════════════════
   FIREBASE INIT
═══════════════════════════════════════ */
async function initData(){
  _fbOn = firebaseInit();
  setSyncBadge(_fbOn);
  if(_fbOn){
    listenProjects(docs=>{ _projects = docs; refreshAll(); });
    listenTasks(docs=>{ _tasks = docs; refreshAll(); });
  } else {
    _projects = JSON.parse(localStorage.getItem(LS_PROJ)||'[]');
    _tasks    = JSON.parse(localStorage.getItem(LS_TASK)||'[]');
  }
}

function setSyncBadge(on){
  const b = document.getElementById('sync-badge');
  if(!b) return;
  b.textContent = on ? '🔴 Live' : '💾 Local';
  b.style.color = on ? 'var(--grn)' : 'var(--tx3)';
}

function refreshAll(){
  if(!currentUser) return;
  renderDashboard();
}

/* ═══════════════════════════════════════
   AUTH
═══════════════════════════════════════ */
function login(){
  const uid_sel = document.getElementById('login-user').value;
  const pass    = document.getElementById('login-pass').value;
  const user    = USERS[uid_sel];
  if(!user || user.pass !== pass){
    document.getElementById('login-err').classList.add('show');
    return;
  }
  document.getElementById('login-err').classList.remove('show');
  currentUser = user;
  localStorage.setItem(LS_USER, uid_sel);
  showApp();
}

function logout(){
  currentUser = null;
  localStorage.removeItem(LS_USER);
  document.getElementById('screen-app').classList.add('hidden');
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-pass').value = '';
}

function showApp(){
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').classList.remove('hidden');
  renderNav();
  renderTabs();
  renderDashboard();
  setTimeout(showAlerts, 600);
}

/* ═══════════════════════════════════════
   NAV + TABS
═══════════════════════════════════════ */
function renderNav(){
  const u = currentUser;
  const rm = ROLE_META[u.role];
  document.getElementById('nav-av').textContent = u.initials;
  document.getElementById('nav-av').style.cssText += `;border-color:${rm.border};background:${rm.bg};color:${rm.color};`;
  document.getElementById('nav-role-pill').textContent = rm.label;
  document.getElementById('nav-role-pill').style.cssText = `background:${rm.bg};color:${rm.color};border:1px solid ${rm.border};`;
  // user banner
  document.getElementById('ub-av').textContent = u.initials;
  document.getElementById('ub-av').style.cssText = `background:${rm.bg};color:${rm.color};border:1px solid ${rm.border};`;
  document.getElementById('ub-name').textContent = u.name;
  document.getElementById('ub-name').style.color = rm.color;
  document.getElementById('ub-role').textContent = rm.label;
  const banner = document.getElementById('user-banner');
  banner.style.background = rm.bg;
  banner.style.borderColor = rm.border;
  // CSS accent
  document.documentElement.style.setProperty('--accent', rm.color);
  document.documentElement.style.setProperty('--accent2', rm.bg);
  document.documentElement.style.setProperty('--accent3', rm.border);
}

function renderTabs(){
  const isCeo = currentUser.role === 'ceo';
  const tabs = document.getElementById('main-tabs');
  if(isCeo){
    tabs.innerHTML = `
      <button class="tab-btn on" onclick="mainTab('tasks',this)">Mis Tareas</button>
      <button class="tab-btn" onclick="mainTab('gestion',this)">Gestión</button>
      <button class="tab-btn" onclick="mainTab('revision',this)">Revisión</button>`;
  } else {
    tabs.innerHTML = `<button class="tab-btn on" onclick="mainTab('tasks',this)">Mis Tareas</button>`;
  }
}

function mainTab(tab, btn){
  ['tasks','gestion','revision'].forEach(t=>{
    document.getElementById('view-'+t)?.classList.add('hidden');
  });
  document.querySelectorAll('#main-tabs .tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('view-'+tab)?.classList.remove('hidden');
  btn.classList.add('on');
  if(tab==='tasks')    renderDashboard();
  if(tab==='gestion')  renderGestion();
  if(tab==='revision') renderRevision();
}

function subTab(tab, btn){
  ['hoy','semana','prioridad'].forEach(t=>document.getElementById('view-'+t)?.classList.add('hidden'));
  document.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('view-'+tab)?.classList.remove('hidden');
  btn.classList.add('on');
  if(tab==='hoy')       renderHoy();
  if(tab==='semana')    renderSemana();
  if(tab==='prioridad') renderPrioridad();
}

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
function myTasks(){
  return _tasks.filter(t=>Array.isArray(t.assignedUsers) && t.assignedUsers.includes(currentUser.id));
}

function renderDashboard(){
  if(!currentUser) return;
  const pending = myTasks().filter(t=>t.status!=='done').length;
  document.getElementById('ub-pending').textContent = pending;
  const active = document.querySelector('.sub-tab.on');
  const which = active ? active.getAttribute('onclick').match(/'(\w+)'/)?.[1] : 'hoy';
  if(which==='semana')    renderSemana();
  else if(which==='prioridad') renderPrioridad();
  else renderHoy();
}

function todayStr(){ return new Date().toISOString().split('T')[0]; }

function weekRange(){
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - (day===0?6:day-1));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: mon.toISOString().split('T')[0], end: sun.toISOString().split('T')[0] };
}

function renderHoy(){
  const today = todayStr();
  const tasks = myTasks().filter(t=>t.dueDate===today || (!t.dueDate && t.status!=='done'));
  const dueTasks   = tasks.filter(t=>t.dueDate===today);
  const noDue      = tasks.filter(t=>!t.dueDate && t.status!=='done');
  const overdue    = myTasks().filter(t=>t.dueDate && t.dueDate<today && t.status!=='done');
  const el = document.getElementById('view-hoy');
  let html = '';
  if(overdue.length){
    html += `<div class="sec-lbl" style="color:var(--red);">⚠️ Vencidas (${overdue.length})</div>`;
    html += overdue.map(t=>taskCardHTML(t,'overdue')).join('');
  }
  if(dueTasks.length){
    html += `<div class="sec-lbl">📅 Para Hoy</div>`;
    html += dueTasks.map(t=>taskCardHTML(t,'due-today')).join('');
  }
  if(noDue.length){
    html += `<div class="sec-lbl">🗂 Sin fecha</div>`;
    html += noDue.map(t=>taskCardHTML(t,'')).join('');
  }
  if(!html) html = '<div class="empty"><div class="empty-icon">🎉</div><p>Sin tareas pendientes para hoy</p></div>';
  el.innerHTML = html;
}

function renderSemana(){
  const wr = weekRange();
  const days = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const today = todayStr();
  const mon = new Date(wr.start);
  const el = document.getElementById('view-semana');
  let html = '';
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const dStr = d.toISOString().split('T')[0];
    const dt = myTasks().filter(t=>t.dueDate===dStr && t.status!=='done');
    const isToday = dStr===today;
    const label = `${days[i]} ${d.getDate()}/${d.getMonth()+1}`;
    if(dt.length || isToday){
      html += `<div class="sec-lbl" style="${isToday?'color:var(--accent);':''}">
        ${isToday?'📍 ':''} ${label}${dt.length?` (${dt.length})`:''}
      </div>`;
      if(dt.length) html += dt.map(t=>taskCardHTML(t,dStr<today?'overdue':'')).join('');
      else html += `<div class="txt-xs txt-muted" style="padding:6px 2px;margin-bottom:8px;">Sin tareas</div>`;
    }
  }
  const noDate = myTasks().filter(t=>!t.dueDate && t.status!=='done');
  if(noDate.length){
    html += `<div class="sec-lbl">🗂 Sin fecha</div>`;
    html += noDate.map(t=>taskCardHTML(t,'')).join('');
  }
  if(!html) html = '<div class="empty"><div class="empty-icon">✅</div><p>Sin tareas esta semana</p></div>';
  el.innerHTML = html;
}

function renderPrioridad(){
  const el = document.getElementById('view-prioridad');
  let html = '';
  ['alta','media','baja'].forEach(p=>{
    const pts = myTasks().filter(t=>t.priority===p);
    if(!pts.length) return;
    const pm = PRIO_META[p];
    html += `<div class="sec-lbl">${p==='alta'?'🔴':p==='media'?'🟡':'🟢'} ${pm.label} (${pts.length})</div>`;
    html += pts.map(t=>taskCardHTML(t,'')).join('');
  });
  if(!html) html = '<div class="empty"><div class="empty-icon">🏖</div><p>Sin tareas asignadas</p></div>';
  el.innerHTML = html;
}

/* ═══════════════════════════════════════
   TASK CARD HTML
═══════════════════════════════════════ */
function taskCardHTML(t, extraClass=''){
  const isDone = t.status==='done';
  const proj = _projects.find(p=>p.id===t.projectId);
  const am = AREA_META[t.area] || AREA_META.general;
  const pm = PRIO_META[t.priority] || PRIO_META.media;
  const assignees = (t.assignedUsers||[]).map(uid=>{
    const u = USERS[uid];
    if(!u) return '';
    const rm = ROLE_META[u.role];
    return `<div class="user-dot" style="background:${rm.bg};color:${rm.color};" title="${u.name}">${u.initials}</div>`;
  }).join('');
  const due = t.dueDate ? `<span class="txt-xs txt-muted">📅 ${t.dueDate}</span>` : '';
  return `
  <div class="task-card ${isDone?'done-card':''} ${extraClass}" id="tc-${t.id}">
    <div class="tc-top">
      <div class="tc-check ${isDone?'done':''}" onclick="toggleTask('${t.id}')">
        <svg viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1,5 4.5,8.5 11,1"/></svg>
      </div>
      <div class="tc-body">
        <div class="tc-name ${isDone?'done':''}">${esc(t.name)}</div>
        <div class="tc-meta">
          ${proj?`<span class="txt-xs txt-muted">${proj.icon||'📁'} ${esc(proj.name)}</span>`:''}
          <span class="bdg ${am.cls}">${am.icon} ${am.label}</span>
          <span class="bdg ${pm.cls}">${pm.label}</span>
          ${due}
          ${assignees}
        </div>
      </div>
      <div class="tc-actions">
        <button class="btn-icon" onclick="openEditTask('${t.id}')" title="Editar">✏️</button>
        <button class="btn-icon btn-danger" onclick="deleteTask('${t.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════
   ALERTS POPUP
═══════════════════════════════════════ */
function showAlerts(){
  const today = todayStr();
  const urgent = myTasks().filter(t=>t.status!=='done' && t.dueDate && t.dueDate<=today);
  if(!urgent.length) return;
  const list = document.getElementById('alert-list');
  list.innerHTML = urgent.map(t=>{
    const isOverdue = t.dueDate < today;
    const proj = _projects.find(p=>p.id===t.projectId);
    return `<div class="alert-item">
      <div class="alert-dot" style="background:${isOverdue?'var(--red)':'var(--org)'}"></div>
      <div>
        <div style="font-size:12px;font-weight:600;">${esc(t.name)}</div>
        <div class="txt-xs txt-muted">${proj?proj.name:''} · ${isOverdue?'Vencida':'Hoy'}: ${t.dueDate}</div>
      </div>
    </div>`;
  }).join('');
  openModal('modal-alert');
}

/* ═══════════════════════════════════════
   GESTIÓN (CEO)
═══════════════════════════════════════ */
let expandedProj = null;

function renderGestion(){
  renderGestionProjects();
  renderGestionTasks();
  populateProjSelects();
}

function renderGestionProjects(){
  const el = document.getElementById('gestion-proyectos');
  if(!_projects.length){
    el.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><p>Sin proyectos. Crea el primero.</p></div>';
    return;
  }
  el.innerHTML = _projects.map(p=>{
    const pt = _tasks.filter(t=>t.projectId===p.id);
    const done = pt.filter(t=>t.status==='done').length;
    const pct = pt.length ? Math.round(done/pt.length*100) : 0;
    const exp = expandedProj===p.id;
    const cycleLabel = {weekly:'Semanal',biweekly:'Quincenal',monthly:'Mensual'}[p.cycle]||'';
    let taskList = '';
    if(exp){
      taskList = pt.length
        ? `<div class="task-inlist">${pt.map(t=>taskCardHTML(t,'')).join('')}</div>`
        : `<div class="task-inlist"><div class="txt-xs txt-muted" style="text-align:center;padding:8px 0;">Sin tareas — agrégalas desde el panel de abajo</div></div>`;
    }
    return `
    <div class="proj-card ${exp?'expanded':''}" id="pc-${p.id}">
      <div class="pc-top" onclick="toggleExpandProj('${p.id}')">
        <div class="pc-icon">${p.icon||'📁'}</div>
        <div class="pc-info">
          <div class="pc-name">${esc(p.name)}</div>
          <div class="pc-desc">${esc(p.desc)||'Sin descripción'}</div>
          <div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;">
            ${p.type==='cyclic'?`<span class="bdg bdg-blu">🔄 ${cycleLabel}</span>`:'<span class="bdg bdg-grey">📌 Único</span>'}
            <span class="bdg ${p.status==='active'?'bdg-grn':p.status==='paused'?'bdg-org':'bdg-grey'}">${{active:'Activo',paused:'Pausado',done:'Listo'}[p.status]||p.status}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
          <span class="txt-xs txt-muted">${pt.length} tareas</span>
          <div class="flex gap-6">
            <button class="btn-icon" onclick="event.stopPropagation();openEditProject('${p.id}')" title="Editar">✏️</button>
            <button class="btn-icon btn-danger" onclick="event.stopPropagation();deleteProject('${p.id}')" title="Eliminar">✕</button>
          </div>
        </div>
      </div>
      <div>
        <div class="flex" style="justify-content:space-between;margin-top:8px;">
          <span class="txt-xs txt-muted">${done}/${pt.length} completadas</span>
          <span class="txt-xs txt-muted">${pct}%</span>
        </div>
        <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      ${taskList}
    </div>`;
  }).join('');
}

function toggleExpandProj(id){
  expandedProj = expandedProj===id ? null : id;
  renderGestionProjects();
}

function renderGestionTasks(){
  const filterUser = document.getElementById('filter-user')?.value||'all';
  const filterArea = document.getElementById('filter-area')?.value||'all';
  let tasks = [..._tasks];
  if(filterUser!=='all') tasks = tasks.filter(t=>(t.assignedUsers||[]).includes(filterUser));
  if(filterArea!=='all') tasks = tasks.filter(t=>t.area===filterArea);
  const el = document.getElementById('gestion-tasks');
  if(!tasks.length){ el.innerHTML='<div class="empty"><p>Sin tareas.</p></div>'; return; }
  // group by project
  const byProj = {};
  tasks.forEach(t=>{ if(!byProj[t.projectId]) byProj[t.projectId]=[]; byProj[t.projectId].push(t); });
  el.innerHTML = Object.entries(byProj).map(([pid,ts])=>{
    const p = _projects.find(x=>x.id===pid);
    return `<div class="sec-lbl">${p?p.icon+' '+p.name:'Sin proyecto'}</div>
    <div style="margin-bottom:10px;">${ts.map(t=>taskCardHTML(t,'')).join('')}</div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   REVISIÓN (CEO)
═══════════════════════════════════════ */
function renderRevision(){
  const done = _tasks.filter(t=>t.status==='done').length;
  const pct  = _tasks.length ? Math.round(done/_tasks.length*100) : 0;
  document.getElementById('rev-stats').innerHTML = `
    <div class="stat-box"><div class="stat-n">${_projects.length}</div><div class="stat-l">Proyectos</div></div>
    <div class="stat-box"><div class="stat-n">${_tasks.length}</div><div class="stat-l">Tareas</div></div>
    <div class="stat-box"><div class="stat-n">${pct}%</div><div class="stat-l">Ejecutado</div></div>`;
  // project table
  const rt = document.getElementById('rev-table');
  if(!_projects.length){ rt.innerHTML='<div class="empty"><p>Sin proyectos.</p></div>'; }
  else{
    rt.innerHTML=`<table class="rev-tbl">
      <thead><tr><th>Proyecto</th><th>Tipo</th><th>Tareas</th><th>Done</th><th>%</th><th>Estado</th></tr></thead>
      <tbody>${_projects.map(p=>{
        const pt=_tasks.filter(t=>t.projectId===p.id);
        const pd=pt.filter(t=>t.status==='done').length;
        const pp=pt.length?Math.round(pd/pt.length*100):0;
        const cl={weekly:'Semanal',biweekly:'Quincenal',monthly:'Mensual'}[p.cycle]||'';
        return `<tr>
          <td>${p.icon||'📁'} ${esc(p.name)}</td>
          <td>${p.type==='cyclic'?`<span class="bdg bdg-blu">🔄 ${cl}</span>`:'<span class="bdg bdg-grey">Único</span>'}</td>
          <td>${pt.length}</td><td>${pd}</td>
          <td><div class="prog-bg" style="width:80px;display:inline-block;vertical-align:middle;"><div class="prog-fill" style="width:${pp}%"></div></div> <span class="txt-xs">${pp}%</span></td>
          <td><span class="bdg ${p.status==='active'?'bdg-grn':p.status==='paused'?'bdg-org':'bdg-grey'}">${{active:'Activo',paused:'Pausado',done:'Listo'}[p.status]||p.status}</span></td>
        </tr>`;
      }).join('')}</tbody></table>`;
  }
  // user load
  const ru = document.getElementById('rev-users');
  ru.innerHTML = Object.values(USERS).map(u=>{
    const ut = _tasks.filter(t=>(t.assignedUsers||[]).includes(u.id));
    const ud = ut.filter(t=>t.status==='done').length;
    const up = ut.length-ud;
    const uu = ut.length?Math.round(ud/ut.length*100):0;
    const rm = ROLE_META[u.role];
    return `<div class="flex gap-10" style="padding:10px 0;border-bottom:1px solid var(--bd);">
      <div class="user-dot" style="width:28px;height:28px;font-size:10px;background:${rm.bg};color:${rm.color};">${u.initials}</div>
      <div style="flex:1;">
        <div style="font-size:12px;font-weight:600;">${u.name}</div>
        <div class="txt-xs txt-muted">${up} pendiente${up!==1?'s':''} · ${ud} completada${ud!==1?'s':''}</div>
      </div>
      <div style="width:100px;text-align:right;">
        <div class="prog-bg"><div class="prog-fill" style="width:${uu}%"></div></div>
        <div class="txt-xs txt-muted" style="margin-top:2px;">${uu}%</div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   CRUD — PROJECTS
═══════════════════════════════════════ */
async function saveProject(){
  const id   = document.getElementById('mp-id').value || uid();
  const name = document.getElementById('mp-name').value.trim();
  if(!name) return alert('El proyecto necesita nombre.');
  const cyclic = document.getElementById('mp-type').value==='cyclic';
  const proj = {
    id, name,
    desc:  document.getElementById('mp-desc').value.trim(),
    type:  document.getElementById('mp-type').value,
    cycle: cyclic ? document.getElementById('mp-cycle').value : null,
    icon:  document.getElementById('mp-icon').value||'📁',
    status: _projects.find(p=>p.id===id)?.status || 'active',
    createdAt: _projects.find(p=>p.id===id)?.createdAt || Date.now(),
  };
  await persistProject(proj);
  closeModal('modal-proj');
  clearProjForm();
  if(!_fbOn){ renderGestionProjects(); populateProjSelects(); }
}

function clearProjForm(){
  ['mp-id','mp-name','mp-desc','mp-icon'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mp-type').value='once';
  document.getElementById('mp-cycle').value='weekly';
  document.getElementById('mp-cycle-wrap').style.display='none';
  document.getElementById('modal-proj-title').textContent='Nuevo Proyecto';
}

function openEditProject(id){
  const p = _projects.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('mp-id').value    = p.id;
  document.getElementById('mp-name').value  = p.name;
  document.getElementById('mp-desc').value  = p.desc||'';
  document.getElementById('mp-icon').value  = p.icon||'';
  document.getElementById('mp-type').value  = p.type||'once';
  document.getElementById('mp-cycle').value = p.cycle||'weekly';
  document.getElementById('mp-cycle-wrap').style.display = p.type==='cyclic'?'block':'none';
  document.getElementById('modal-proj-title').textContent = 'Editar Proyecto';
  openModal('modal-proj');
}

async function deleteProject(id){
  if(!confirm('¿Eliminar proyecto y sus tareas?')) return;
  await removeProject(id);
  if(!_fbOn){ renderGestionProjects(); populateProjSelects(); }
}

/* ═══════════════════════════════════════
   CRUD — TASKS
═══════════════════════════════════════ */
async function createTask(){
  const projId = document.getElementById('t-proj').value;
  const name   = document.getElementById('t-name').value.trim();
  if(!projId) return alert('Selecciona un proyecto.');
  if(!name)   return alert('La tarea necesita nombre.');
  const assigned = [...document.querySelectorAll('#assign-grid .assign-chip.selected')].map(el=>el.querySelector('input').value);
  const task = {
    id: uid(), projectId: projId, name,
    desc:         document.getElementById('t-desc').value.trim(),
    area:         document.getElementById('t-area').value,
    priority:     document.getElementById('t-prio').value,
    dueDate:      document.getElementById('t-due').value,
    assignedUsers: assigned,
    status: 'pending', createdAt: Date.now(),
  };
  await persistTask(task);
  document.getElementById('t-name').value='';
  document.getElementById('t-desc').value='';
  document.getElementById('t-due').value='';
  document.querySelectorAll('#assign-grid .assign-chip').forEach(c=>c.classList.remove('selected'));
  if(!_fbOn){ renderGestionTasks(); renderGestionProjects(); }
}

function openEditTask(id){
  const t = _tasks.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('et-id').value   = t.id;
  document.getElementById('et-name').value = t.name;
  document.getElementById('et-desc').value = t.desc||'';
  document.getElementById('et-area').value = t.area||'general';
  document.getElementById('et-prio').value = t.priority||'media';
  document.getElementById('et-due').value  = t.dueDate||'';
  populateProjSelects('et-proj', t.projectId);
  // set assignees
  document.querySelectorAll('#et-assign-grid .assign-chip').forEach(chip=>{
    const val = chip.querySelector('input').value;
    chip.classList.toggle('selected', (t.assignedUsers||[]).includes(val));
  });
  openModal('modal-task-edit');
}

async function saveTask(){
  const id = document.getElementById('et-id').value;
  const t  = _tasks.find(x=>x.id===id);
  if(!t) return;
  const assigned = [...document.querySelectorAll('#et-assign-grid .assign-chip.selected')].map(el=>el.querySelector('input').value);
  Object.assign(t, {
    name:          document.getElementById('et-name').value.trim(),
    desc:          document.getElementById('et-desc').value.trim(),
    area:          document.getElementById('et-area').value,
    priority:      document.getElementById('et-prio').value,
    dueDate:       document.getElementById('et-due').value,
    projectId:     document.getElementById('et-proj').value,
    assignedUsers: assigned,
  });
  await persistTask(t);
  closeModal('modal-task-edit');
  if(!_fbOn) refreshAll();
}

async function toggleTask(id){
  const t = _tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = t.status==='done' ? 'pending' : 'done';
  await persistTask(t);
  if(!_fbOn) refreshAll();
}

async function deleteTask(id){
  await removeTask(id);
  if(!_fbOn) refreshAll();
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function toggleAssign(chip, _uid){
  chip.classList.toggle('selected');
}

function populateProjSelects(targetId, selectedId){
  const ids = targetId ? [targetId] : ['t-proj','et-proj'];
  ids.forEach(sid=>{
    const sel = document.getElementById(sid);
    if(!sel) return;
    sel.innerHTML = _projects.length
      ? _projects.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.icon||'📁'} ${esc(p.name)}</option>`).join('')
      : '<option value="">— Sin proyectos —</option>';
  });
}

function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }

document.querySelectorAll('.modal-ov').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); });
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
