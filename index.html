<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FCNOISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --tx:#f4f4f7; --tx3:#8b909a;
  --orange:#ff7a00; --blu:#3b82f6;
  --font-display:'Bebas Neue','Impact',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font-body);overflow:hidden;}
/* fondo con blobs de color que el vidrio recoge */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 16s ease-in-out infinite;}
.blob.o{width:520px;height:520px;background:radial-gradient(circle,rgba(255,122,0,.55),transparent 70%);top:-140px;left:-100px;}
.blob.b{width:560px;height:560px;background:radial-gradient(circle,rgba(59,130,246,.5),transparent 70%);bottom:-180px;right:-120px;animation-delay:-8s;}
.blob.p{width:360px;height:360px;background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%);top:40%;left:45%;animation-delay:-4s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-30px) scale(1.08);}}

.stage{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px;}
.brand-logo{width:clamp(84px,12vw,116px);height:auto;margin-bottom:18px;filter:drop-shadow(0 8px 26px rgba(255,122,0,.20));animation:logoIn .8s cubic-bezier(.2,.7,.2,1) both;}
.brand-tag{font-family:var(--font-body);font-size:10.5px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:var(--tx3);margin-bottom:44px;padding-left:.4em;animation:logoIn .8s cubic-bezier(.2,.7,.2,1) .06s both;}
@keyframes logoIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:none;}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:18px;width:100%;max-width:680px;}

.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-decoration:none;color:inherit;min-height:196px;padding:24px;border-radius:24px;overflow:hidden;cursor:pointer;
  background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid rgba(255,255,255,.10); border-top-color:rgba(255,255,255,.20);
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .34s cubic-bezier(.2,.7,.2,1), box-shadow .34s, border-color .34s;animation:logoIn .7s cubic-bezier(.2,.7,.2,1) both;}
.card.fcn{animation-delay:.12s;}.card.spo{animation-delay:.18s;}
.card::after{content:"";position:absolute;inset:0;border-radius:24px;background:radial-gradient(200px 130px at 26% -10%,rgba(255,255,255,.10),transparent 70%);pointer-events:none;}
.card:hover{transform:translateY(-5px);border-top-color:rgba(255,255,255,.32);}
.card:active{transform:translateY(-1px) scale(.995);}
.card-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);}
.card-ico svg{width:23px;height:23px;stroke-width:1.6;}
.card-ttl{font-family:var(--font-display);font-size:29px;letter-spacing:.04em;line-height:1.02;}
.card-arw{position:absolute;top:26px;right:24px;opacity:.45;transition:transform .3s,opacity .3s;display:flex;}
.card-arw svg{width:19px;height:19px;stroke-width:1.8;}
.card:hover .card-arw{transform:translateX(4px);opacity:1;}
.card.fcn{box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -40px 70px rgba(255,122,0,.09);}
.card.fcn:hover{box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -40px 80px rgba(255,122,0,.16);}
.card.fcn .card-ico{color:var(--orange);border-color:rgba(255,122,0,.28);background:linear-gradient(150deg,rgba(255,122,0,.16),rgba(255,122,0,.04));}
.card.fcn .card-ttl,.card.fcn .card-arw{color:var(--orange);}
.card.spo{box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -40px 70px rgba(59,130,246,.10);}
.card.spo:hover{box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -40px 80px rgba(59,130,246,.18);}
.card.spo .card-ico{color:var(--blu);border-color:rgba(59,130,246,.30);background:linear-gradient(150deg,rgba(59,130,246,.16),rgba(59,130,246,.04));}
.card.spo .card-ttl,.card.spo .card-arw{color:var(--blu);}
</style>
</head>
<body>
<div class="bgfx"><div class="blob o"></div><div class="blob b"></div><div class="blob p"></div></div>
<div class="stage">
  <img class="brand-logo" src="./assets/fcnoise-logo-ondark.png" alt="FC NOISE — Est. 2007">
  <div class="brand-tag">Central del Club</div>
  <div class="grid">
    <a class="card fcn" href="./portal.html">
      <div class="card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7.2 3.7 2.7-1.4 4.4H9.7L8.3 9.9z"/><path d="M12 7.2V4M15.7 9.9l3-1.1M14.3 14.3l1.9 2.5M9.7 14.3l-1.9 2.5M8.3 9.9l-3-1.1"/></svg>
      </div>
      <div class="card-ttl">Project<br>FCNOISE</div>
      <span class="card-arw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
    </a>
    <a class="card spo" href="./sponsor.html">
      <div class="card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.9-3.9a3 3 0 0 0-4.2 0l-.9.9a1 1 0 1 1-3-3l2.8-2.8a5.8 5.8 0 0 1 7.1-.9l.5.3a2 2 0 0 0 1.4.2L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>
      </div>
      <div class="card-ttl">Portal<br>Sponsors</div>
      <span class="card-arw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
    </a>
  </div>
</div>
</body>
</html>
