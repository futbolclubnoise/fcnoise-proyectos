<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FCNOISE — Sponsors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef3;--card:#ffffff;--tx:#16181d;--tx2:#4a4d55;--tx3:#8a8f99;
  --glass:linear-gradient(155deg,rgba(255,255,255,.82),rgba(255,255,255,.62));
  --bd:rgba(0,0,0,.09);--bdt:rgba(255,255,255,.7);--bd2:rgba(0,0,0,.06);
  --inp:#f3f4f7;
  --orange:#ff7a00;--blu:#2f74e6;--grn:#1faa55;--red:#e5484d;--yel:#e8a017;--pur:#7c5cff;
  --font-display:'Bebas Neue','Impact',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --shadow:0 10px 34px rgba(20,30,60,.10),inset 0 1px 0 rgba(255,255,255,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font-body);font-size:14px;-webkit-text-size-adjust:100%;min-height:100dvh;}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;}
.blob.o{width:460px;height:460px;background:radial-gradient(circle,rgba(255,150,60,.55),transparent 70%);top:-150px;right:-110px;}
.blob.b{width:520px;height:520px;background:radial-gradient(circle,rgba(90,150,255,.5),transparent 70%);bottom:-190px;left:-140px;}
.hidden{display:none!important;}
button{font-family:var(--font-body);cursor:pointer;}
input,select{font-family:var(--font-body);}
a{color:var(--blu);}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--bd);box-shadow:var(--shadow);}
.btn{border:1px solid transparent;border-radius:11px;padding:10px 15px;font-size:12px;font-weight:700;letter-spacing:.02em;transition:transform .15s,opacity .15s;}
.btn:active{transform:scale(.97);}
.btn-p{background:linear-gradient(180deg,#3d82f0,#2f6fe0);color:#fff;box-shadow:0 6px 16px rgba(47,116,230,.28);}
.btn-o{background:linear-gradient(180deg,#ff9127,#ff6f05);color:#fff;box-shadow:0 6px 16px rgba(255,122,0,.28);}
.btn-g{background:#fff;border-color:var(--bd);color:var(--tx2);}
.btn-sm{padding:8px 12px;font-size:11px;}
.btn-xs{padding:6px 10px;font-size:10.5px;border-radius:9px;}
.btn:hover{opacity:.94;}
.btn-del{background:#fff;border:1px solid rgba(229,72,77,.3);color:var(--red);width:28px;height:28px;padding:0;border-radius:9px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;}
.lico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0;}
.pub-metric .lico,.ct .lico{width:13px;height:13px;vertical-align:-2px;margin-right:3px;}
.icobtn .lico{width:15px;height:15px;}
.pub-link .lico{width:12px;height:12px;vertical-align:-1px;margin-left:3px;}
.icobtn{background:#fff;border:1px solid var(--bd);color:var(--tx3);width:29px;height:29px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
label{display:block;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;font-weight:700;}
.fi{margin-bottom:15px;}
.fi input,.fi select,.fi textarea{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;color:var(--tx);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
.fi input:focus,.fi select:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,116,230,.14);background:#fff;}
.row{display:flex;gap:11px;}.row>*{flex:1;}
option{background:#fff;color:var(--tx);}

#screen-login{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;}
.langsw{position:fixed;top:16px;right:16px;z-index:5;display:flex;background:#fff;border:1px solid var(--bd);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
.langsw button{background:transparent;border:none;color:var(--tx3);font-size:11px;font-weight:700;padding:7px 12px;letter-spacing:.05em;}
.langsw button.on{background:var(--blu);color:#fff;}
.back-hub{position:fixed;top:16px;left:16px;z-index:5;font-size:12px;font-weight:600;color:var(--tx2);text-decoration:none;background:#fff;border:1px solid var(--bd);padding:8px 13px;border-radius:11px;box-shadow:var(--shadow);}
.brand{font-family:var(--font-display);font-size:56px;letter-spacing:.02em;line-height:1;}
.brand em{color:var(--orange);font-style:normal;}
.brand-img{width:clamp(150px,42vw,186px);height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.14));}
.tb-brand-img{height:38px;width:auto;display:block;}
.login-sub{font-size:11px;letter-spacing:.3em;color:var(--tx3);text-transform:uppercase;margin:8px 0 30px;}
.login-card{width:100%;max-width:370px;border-radius:22px;padding:26px;}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;text-align:center;}
.login-err.show{display:block;}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:11px;padding:12px 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--bd2);}
.tb-back{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--tx2);text-decoration:none;background:#fff;border:1px solid var(--bd);}
.tb-back:hover{color:var(--orange);}
.tb-brand{font-family:var(--font-display);font-size:19px;letter-spacing:.03em;}
.tb-brand em{color:var(--orange);font-style:normal;}
.tb-role{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--bd);}
.tb-role.admin{background:rgba(255,122,0,.12);color:#c85e00;}
.tb-role.sponsor{background:rgba(47,116,230,.12);color:var(--blu);}
.tb-sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
.sync{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:5px;}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);}
.sync.live .dot{background:var(--grn);box-shadow:0 0 0 3px rgba(31,170,85,.18);}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:18px 16px 70px;}
.page-title{font-family:var(--font-display);font-size:28px;letter-spacing:.03em;margin:6px 0 16px;}
.card{border-radius:20px;padding:18px;margin-bottom:15px;background:var(--card);border:1px solid var(--bd2);box-shadow:var(--shadow);}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.card-ttl{font-family:var(--font-display);font-size:15px;letter-spacing:.07em;color:var(--tx2);flex:1;}

.sp-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd2);border-radius:14px;margin-bottom:9px;cursor:pointer;transition:border-color .18s,background .18s;background:#fff;}
.sp-item:hover{border-color:var(--blu);}
.sp-item.on{border-color:var(--blu);background:rgba(47,116,230,.06);}
.sp-logo{width:42px;height:42px;border-radius:13px;background:var(--inp);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.sp-name{font-weight:700;font-size:14px;}
.sp-meta{font-size:11px;color:var(--tx3);}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:15px;}
.stat{border-radius:17px;padding:16px 12px;text-align:center;background:var(--card);border:1px solid var(--bd2);box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-display);font-size:30px;line-height:1;letter-spacing:.02em;}
.stat-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;font-weight:600;}

.ct{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--inp);color:var(--tx2);border:1px solid var(--bd);}
.pub{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--bd2);}
.pub:last-child{border-bottom:none;}
.pub-main{flex:1;min-width:0;}
.pub-ttl{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pub-sub{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.pub-metric{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx2);}
.pub-link{font-size:11px;font-weight:700;color:var(--blu);text-decoration:none;flex-shrink:0;}
.pub-actions{display:flex;gap:6px;flex-shrink:0;}

/* cycle card */
.cyc{border:1px solid var(--bd2);border-radius:16px;padding:15px;margin-bottom:13px;background:var(--card);box-shadow:0 4px 16px rgba(20,30,60,.06);}
.cyc-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
.cyc-mon{font-family:var(--font-display);font-size:19px;letter-spacing:.03em;flex:1;text-transform:capitalize;}
.cyc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.cyc-tile{background:var(--inp);border:1px solid var(--bd2);border-radius:12px;padding:11px 8px;text-align:center;}
.cyc-tile.reach{background:linear-gradient(160deg,rgba(124,92,255,.12),rgba(124,92,255,.04));border-color:rgba(124,92,255,.25);}
.cyc-tnum{font-family:var(--font-display);font-size:22px;line-height:1;}
.cyc-tlbl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;font-weight:600;}

.mg-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd2);}
.mg-row:last-child{border-bottom:none;}
.mg-mon{width:84px;font-size:12px;font-weight:700;color:var(--tx2);flex-shrink:0;text-transform:capitalize;}
.mg-track{flex:1;height:22px;background:var(--inp);border-radius:7px;overflow:hidden;border:1px solid var(--bd2);}
.mg-fill{height:100%;background:linear-gradient(90deg,var(--blu),var(--pur));border-radius:7px;}
.mg-val{width:72px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}
.mg-delta{width:64px;text-align:right;font-size:11px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums;}
.mg-delta.up{color:var(--grn);}.mg-delta.down{color:var(--red);}.mg-delta.flat{color:var(--tx3);}
.cmp-pills{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.cmp-pill{padding:7px 13px;border-radius:20px;background:var(--inp);border:1px solid var(--bd);color:var(--tx2);font-size:12px;font-weight:700;}
.cmp-pill.on{background:var(--tx);border-color:var(--tx);color:#fff;}

.mov{position:fixed;inset:0;background:rgba(20,25,40,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(5px);}
.mov.open{opacity:1;pointer-events:all;}
.modal{border-radius:22px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:#fff;border:1px solid var(--bd);box-shadow:0 30px 80px rgba(20,30,60,.28);}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mttl{font-family:var(--font-display);font-size:19px;letter-spacing:.04em;}
.mclose{background:var(--inp);border:1px solid var(--bd);color:var(--tx2);width:31px;height:31px;border-radius:10px;font-size:15px;}
.empty{text-align:center;padding:30px 10px;color:var(--tx3);font-size:13px;}
.ctype-pills{display:flex;flex-wrap:wrap;gap:7px;}
.ctype-pill{padding:8px 13px;border-radius:11px;background:var(--inp);border:1px solid var(--bd);color:var(--tx2);font-size:12px;font-weight:600;}
.ctype-pill.on{background:var(--blu);border-color:transparent;color:#fff;}
@media(max-width:520px){.stat-num{font-size:23px;}.mg-mon{width:66px;}}
</style>
</head>
<body>
<div class="bgfx"><div class="blob o"></div><div class="blob b"></div></div>

<!-- LOGIN -->
<div id="screen-login">
  <a class="back-hub" href="./index.html" id="back-lbl">← Base</a>
  <div class="langsw"><button data-l="es" onclick="setLang('es')">ES</button><button data-l="en" onclick="setLang('en')">EN</button></div>
  <img class="brand-img" src="./assets/fcnoise-logo-onlight.png" alt="FC NOISE">
  <div class="login-sub">Sponsors</div>
  <div class="login-card glass">
    <div class="fi"><label id="lbl-user">User</label><input type="text" id="l-user" placeholder="ADMIN" autocapitalize="off" autocorrect="off" autocomplete="username"></div>
    <div class="fi"><label id="lbl-pass">Password</label><input type="password" id="l-pass" placeholder="••••••" autocomplete="current-password"></div>
    <button class="btn btn-p" style="width:100%;padding:13px;" id="l-btn">Sign in</button>
    <div class="login-err" id="l-err">Wrong user or password</div>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="hidden">
  <div class="topbar">
    <a href="./index.html" class="tb-back" title="Base">←</a>
    <img class="tb-brand-img" src="./assets/fcnoise-logo-onlight.png" alt="FC NOISE">
    <span class="tb-brand" style="display:none;">FC<em>NOISE</em></span>
    <span class="tb-role" id="tb-role"></span>
    <div class="tb-sp">
      <div class="langsw" style="position:static;box-shadow:none;"><button data-l="es" onclick="setLang('es')">ES</button><button data-l="en" onclick="setLang('en')">EN</button></div>
      <span class="sync" id="sync"><span class="dot"></span><span id="sync-lbl"></span></span>
      <button class="btn btn-g btn-sm" id="logout-btn"></button>
    </div>
  </div>
  <div class="wrap" id="app-body"></div>
</div>

<!-- MODAL SPONSOR -->
<div class="mov" id="m-sponsor"><div class="modal">
  <div class="mhdr"><span class="mttl" id="sp-mttl"></span><button class="mclose" onclick="closeMod('m-sponsor')">✕</button></div>
  <input type="hidden" id="sp-id">
  <div class="fi"><label id="lbl-spname"></label><input type="text" id="sp-fname" placeholder="Peroni"></div>
  <div class="row">
    <div class="fi"><label id="lbl-sppass"></label><input type="text" id="sp-fpass" placeholder="123456"></div>
    <div class="fi" style="flex:0 0 92px;"><label>Emoji</label><input type="text" id="sp-flogo" placeholder="" maxlength="4" style="text-align:center;"></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
    <button class="btn btn-g btn-sm" onclick="closeMod('m-sponsor')" id="sp-cancel"></button>
    <button class="btn btn-p btn-sm" id="sp-save"></button>
  </div>
</div></div>

<!-- MODAL CICLO -->
<div class="mov" id="m-cycle"><div class="modal">
  <div class="mhdr"><span class="mttl" id="cy-mttl"></span><button class="mclose" onclick="closeMod('m-cycle')">✕</button></div>
  <input type="hidden" id="cy-id"><input type="hidden" id="cy-sponsor">
  <div class="fi"><label id="lbl-month"></label><input type="month" id="cy-month"></div>
  <div class="fi"><label id="lbl-reach"></label><input type="number" id="cy-reach" placeholder="0" min="0"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
    <button class="btn btn-g btn-sm" onclick="closeMod('m-cycle')" id="cy-cancel"></button>
    <button class="btn btn-p btn-sm" id="cy-save"></button>
  </div>
</div></div>

<!-- MODAL POST -->
<div class="mov" id="m-post"><div class="modal">
  <div class="mhdr"><span class="mttl" id="po-mttl"></span><button class="mclose" onclick="closeMod('m-post')">✕</button></div>
  <input type="hidden" id="po-id"><input type="hidden" id="po-sponsor"><input type="hidden" id="po-month">
  <div class="fi"><label id="lbl-ctype"></label><div class="ctype-pills" id="po-types"></div><input type="hidden" id="po-type" value="carrusel"></div>
  <div class="fi"><label id="lbl-title"></label><input type="text" id="po-title"></div>
  <div class="row">
    <div class="fi"><label id="lbl-views"></label><input type="number" id="po-views" placeholder="0" min="0"></div>
    <div class="fi"><label id="lbl-likes"></label><input type="number" id="po-likes" placeholder="0" min="0"></div>
  </div>
  <div class="fi" id="po-link-wrap"><label id="lbl-link"></label><input type="text" id="po-link" placeholder="https://instagram.com/…"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
    <button class="btn btn-g btn-sm" onclick="closeMod('m-post')" id="po-cancel"></button>
    <button class="btn btn-p btn-sm" id="po-save"></button>
  </div>
</div></div>

const T={

    createCycle:'+ Crear ciclo',noCycles:'Sin ciclos. Crea el primero (un mes).',addPub:'+ Publicación',
    reachTile:'Alcance de la cuenta',viewsTile:'Visualizaciones',likesTile:'Me gusta',noPubsCycle:'Sin publicaciones en este ciclo.',
    growth:'Crecimiento mensual · Alcance de la cuenta',report:'Reporte comparativo por ciclo',noData:'Sin datos.',notitle:'(sin título)',
    newSp:'Nuevo Sponsor',editSp:'Editar Sponsor',spName:'Nombre del sponsor',spPass:'Contraseña',cancel:'Cancelar',save:'Guardar',
    newCy:'Nuevo Ciclo',editCy:'Editar Ciclo',month:'Mes',reachField:'Alcance de la cuenta (impacto a la marca)',
    newPo:'Nueva Publicación',editPo:'Editar Publicación',ctype:'Tipo de contenido',title:'Título',views:'Visualizaciones',likes:'Me gusta',link:'Link',
    needName:'Escribe el nombre del sponsor.',needTitle:'Escribe un título.',needMonth:'Elige un mes.',
    delSp:'¿Borrar el sponsor y todo su contenido?',delCy:'¿Borrar este ciclo y sus publicaciones?',delPo:'¿Borrar esta publicación?',view:'Ver'},
  en:{base:'← Home',user:'User',pass:'Password',signin:'Sign in',bad:'Wrong user or password',pick:'Select…',
    admin:'Admin',sponsor:'Sponsor',signout:'Sign out',live:'Live',conn:'Connecting…',
    sponsors:'Sponsors',createSp:'+ New sponsor',pubs:'posts',noSp:'No sponsors yet. Create the first one.',pickSp:'Select a sponsor above to view/edit its metrics.',
    totalViews:'Total views',totalLikes:'Total likes',totalPubs:'Posts',
    createCycle:'+ New cycle',noCycles:'No cycles yet. Create the first one (a month).',addPub:'+ New post',
    reachTile:'Account reach',viewsTile:'Views',likesTile:'Likes',noPubsCycle:'No posts in this cycle.',
    growth:'Monthly growth · Account reach',report:'Comparative report · by cycle',noData:'No data.',notitle:'(untitled)',
    newSp:'New Sponsor',editSp:'Edit Sponsor',spName:'Sponsor name',spPass:'Password',cancel:'Cancel',save:'Save',
    newCy:'New Cycle',editCy:'Edit Cycle',month:'Month',reachField:'Account reach (brand impact)',
    newPo:'New Post',editPo:'Edit Post',ctype:'Content type',title:'Title',views:'Views',likes:'Likes',link:'Link',
    needName:'Enter the sponsor name.',needTitle:'Enter a title.',needMonth:'Pick a month.',
    delSp:'Delete this sponsor and all its content?',delCy:'Delete this cycle and its posts?',delPo:'Delete this post?',view:'View'}
};

let _sponsors={}, _posts={}, _cycles={}, currentUser=null, selSponsor=null, lang='en', _cmpMetric='reach';
const t=k=>(T[lang]&&T[lang][k])||k;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nfmt=n=>Number(n||0).toLocaleString(lang==='en'?'en-US':'es');
const ctLabel=ty=>CTYPES[ty]?CTYPES[ty][lang]:ty;
const normUrl=u=>{ u=(u||'').trim(); return u&&!/^https?:\/\//i.test(u)?'https://'+u:u; };
const monthLabel=m=>{ if(!m) return ''; const [y,mm]=m.split('-'); return `${MONTHS[lang][+mm-1]} ${y}`; };
const sponsorPosts=sid=>Object.values(_posts).filter(p=>p&&p.sponsorId===sid);
const postMonth=p=>p.month || (p.date||'').slice(0,7); // compat: deriva mes de la fecha
const sponsorCycles=sid=>Object.values(_cycles).filter(c=>c&&c.sponsorId===sid);
function cycleForMonth(sid,m){ return sponsorCycles(sid).find(c=>c.month===m); }
// meses del sponsor: ciclos explícitos + meses de publicaciones existentes
function sponsorMonths(sid){
  const s=new Set(sponsorCycles(sid).map(c=>c.month));
  sponsorPosts(sid).forEach(p=>{ const m=postMonth(p); if(m) s.add(m); });
  return [...s].sort((a,b)=>b.localeCompare(a));
}
const postsInMonth=(sid,m)=>sponsorPosts(sid).filter(p=>postMonth(p)===m);

async function saveSponsor(s){ if(db) try{ await set(ref(db,`${P_SP}/${s.id}`),s); }catch(e){alert('Error');} }
async function delSponsorFb(id){ if(db) try{ await remove(ref(db,`${P_SP}/${id}`)); }catch(e){} }
async function savePost(p){ if(db) try{ await set(ref(db,`${P_PO}/${p.id}`),p); }catch(e){alert('Error');} }
async function delPostFb(id){ if(db) try{ await remove(ref(db,`${P_PO}/${id}`)); }catch(e){} }
async function saveCycle(c){ if(db) try{ await set(ref(db,`${P_CY}/${c.id}`),c); }catch(e){alert('Error');} }
async function delCycleFb(id){ if(db) try{ await remove(ref(db,`${P_CY}/${id}`)); }catch(e){} }

function startListening(){
  if(!db) return;
  onValue(ref(db,P_SP), s=>{ _sponsors=s.val()||{}; setSync(true); populateLoginUsers(); if(currentUser) render(); });
  onValue(ref(db,P_PO), s=>{ _posts=s.val()||{}; setSync(true); if(currentUser) render(); });
  onValue(ref(db,P_CY), s=>{ _cycles=s.val()||{}; setSync(true); if(currentUser) render(); });
}
function setSync(live){ const s=document.getElementById('sync'); const l=document.getElementById('sync-lbl'); if(l)l.textContent=live?t('live'):t('conn'); if(s)s.classList.toggle('live',!!live); }

function setLang(l){ lang=l; document.documentElement.lang=l; document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===l)); applyStaticI18n(); populateLoginUsers(); if(currentUser) render(); }
function applyStaticI18n(){
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('back-lbl',t('base')); set('lbl-user',t('user')); set('lbl-pass',t('pass')); set('l-btn',t('signin')); set('l-err',t('bad')); set('logout-btn',t('signout'));
  set('lbl-spname',t('spName')); set('lbl-sppass',t('spPass')); set('sp-cancel',t('cancel')); set('sp-save',t('save'));
  set('lbl-month',t('month')); set('lbl-reach',t('reachField')); set('cy-cancel',t('cancel')); set('cy-save',t('save'));
  set('lbl-ctype',t('ctype')); set('lbl-title',t('title')); set('lbl-views',t('views')); set('lbl-likes',t('likes')); set('lbl-link',t('link')); set('po-cancel',t('cancel')); set('po-save',t('save'));
  setSync(document.getElementById('sync').classList.contains('live'));
  if(currentUser){ const r=document.getElementById('tb-role'); r.textContent=currentUser.role==='admin'?t('admin'):t('sponsor'); }
  renderTypePills();
}

function populateLoginUsers(){ /* login por texto: sin lista */ }
function doLogin(){
  const raw=(document.getElementById('l-user').value||'').trim(), pass=document.getElementById('l-pass').value;
  if(raw.toLowerCase()==='admin' && pass===ADMIN_PASS){ currentUser={role:'admin',name:'Admin'}; lang='es'; enterApp(); return; }
  // Sponsor: se escribe el nombre (sin distinguir mayúsculas) + su contraseña
  const s=Object.values(_sponsors).find(x=>(x.name||'').trim().toLowerCase()===raw.toLowerCase());
  if(s && (s.pass||'')===pass){ currentUser={role:'sponsor',id:s.id,name:s.name}; selSponsor=s.id; lang='en'; enterApp(); return; }
  document.getElementById('l-err').classList.add('show');
}
function enterApp(){
  document.getElementById('l-err').classList.remove('show');
  document.getElementById('l-pass').value='';
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-app').classList.remove('hidden');
  document.getElementById('tb-role').className='tb-role '+currentUser.role;
  setLang(lang);
}
function logout(){ currentUser=null; selSponsor=null; document.getElementById('screen-app').classList.add('hidden'); document.getElementById('screen-login').classList.remove('hidden'); }

function render(){
  if(!currentUser) return;
  document.getElementById('app-body').innerHTML=currentUser.role==='admin'?renderAdmin():renderDash(selSponsor,false);
}
function renderAdmin(){
  const sps=Object.values(_sponsors).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  let h=`<div class="page-title">${t('sponsors')}</div>
  <div class="card"><div class="card-hdr"><span class="card-ttl">${t('sponsors').toUpperCase()}</span><button class="btn btn-o btn-xs" onclick="openSponsor()">${t('createSp')}</button></div>
  ${sps.length?sps.map(s=>`<div class="sp-item ${s.id===selSponsor?'on':''}" onclick="selectSponsor('${s.id}')">
    <div class="sp-logo">${(s.logo&&s.logo!=='🏷️')?esc(s.logo):ICO.tag}</div>
    <div style="flex:1;"><div class="sp-name">${esc(s.name)}</div><div class="sp-meta">${sponsorPosts(s.id).length} ${t('pubs')}</div></div>
    <button class="icobtn" onclick="event.stopPropagation();openSponsor('${s.id}')">${ICO.pencil}</button>
    <button class="btn-del" onclick="event.stopPropagation();deleteSponsor('${s.id}')">✕</button>
  </div>`).join(''):`<div class="empty">${t('noSp')}</div>`}
  </div>`;
  if(selSponsor&&_sponsors[selSponsor]) h+=renderDash(selSponsor,true);
  return h;
}
function renderDash(sid,admin){
  const s=_sponsors[sid];
  if(!s) return `<div class="empty">${admin?t('pickSp'):''}</div>`;
  const allPosts=sponsorPosts(sid);
  const totV=allPosts.reduce((a,p)=>a+Number(p.views||0),0);
  const totL=allPosts.reduce((a,p)=>a+Number(p.likes||0),0);
  // header
  let h=`<div class="card"><div class="card-hdr">
    <div class="sp-logo">${(s.logo&&s.logo!=='🏷️')?esc(s.logo):ICO.tag}</div>
    <div style="flex:1;"><div class="page-title" style="margin:0;">${esc(s.name)}</div></div>
    ${admin?`<button class="btn btn-o btn-xs" onclick="openCycle('${sid}')">${t('createCycle')}</button>`:''}
  </div>
  <div class="stats" style="margin-bottom:0;">
    <div class="stat" style="box-shadow:none;border:none;background:var(--inp);"><div class="stat-num" style="color:var(--blu);">${nfmt(totV)}</div><div class="stat-lbl">${t('totalViews')}</div></div>
    <div class="stat" style="box-shadow:none;border:none;background:var(--inp);"><div class="stat-num" style="color:var(--red);">${nfmt(totL)}</div><div class="stat-lbl">${t('totalLikes')}</div></div>
    <div class="stat" style="box-shadow:none;border:none;background:var(--inp);"><div class="stat-num" style="color:var(--orange);">${allPosts.length}</div><div class="stat-lbl">${t('totalPubs')}</div></div>
  </div></div>`;

  // Reporte comparativo por ciclo (métrica seleccionable: alcance / visualizaciones / me gusta)
  const months=sponsorMonths(sid);
  const metricVal={
    reach:m=>{ const c=cycleForMonth(sid,m); return c?Number(c.accountReach||0):0; },
    views:m=>postsInMonth(sid,m).reduce((a,p)=>a+Number(p.views||0),0),
    likes:m=>postsInMonth(sid,m).reduce((a,p)=>a+Number(p.likes||0),0),
  };
  const metricMeta={reach:{lbl:t('reachTile'),color:'var(--pur)'},views:{lbl:t('viewsTile'),color:'var(--blu)'},likes:{lbl:t('likesTile'),color:'var(--red)'}};
  if(!metricVal[_cmpMetric]) _cmpMetric='reach';
  const byMonth={}; months.forEach(m=>byMonth[m]=metricVal[_cmpMetric](m));
  const asc=[...months].sort(); const maxV=Math.max(1,...Object.values(byMonth));
  const meta=metricMeta[_cmpMetric];
  const pills=['reach','views','likes'].map(k=>`<button type="button" class="cmp-pill ${k===_cmpMetric?'on':''}" onclick="setCmpMetric('${k}')">${metricMeta[k].lbl}</button>`).join('');
  h+=`<div class="card"><div class="card-hdr"><span class="card-ttl">${t('report').toUpperCase()}</span></div>
    <div class="cmp-pills">${pills}</div>`;
  if(!asc.length || asc.every(m=>!byMonth[m])) h+=`<div class="empty">${t('noData')}</div>`;
  else h+=asc.map((m,i)=>{ const val=byMonth[m]; const prev=i>0?byMonth[asc[i-1]]:null;
    let dh='<span class="mg-delta flat">—</span>';
    if(prev!=null&&prev>0){ const d=(val-prev)/prev*100; const up=d>=0; dh=`<span class="mg-delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</span>`; }
    else if(prev===0&&val>0){ dh='<span class="mg-delta up">▲</span>'; }
    return `<div class="mg-row"><div class="mg-mon">${monthLabel(m)}</div><div class="mg-track"><div class="mg-fill" style="width:${Math.round(val/maxV*100)}%;background:${meta.color};"></div></div><div class="mg-val">${nfmt(val)}</div>${dh}</div>`;
  }).join('');
  h+=`</div>`;

  // Ciclos (meses)
  h+=`<div class="page-title" style="font-size:20px;">${lang==='en'?'Cycles':'Ciclos'}</div>`;
  if(!months.length) h+=`<div class="card"><div class="empty">${t('noCycles')}</div></div>`;
  else h+=months.map(m=>renderCycle(sid,m,admin)).join('');
  return h;
}
function renderCycle(sid,m,admin){
  const c=cycleForMonth(sid,m);
  const posts=postsInMonth(sid,m).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const v=posts.reduce((a,p)=>a+Number(p.views||0),0);
  const l=posts.reduce((a,p)=>a+Number(p.likes||0),0);
  const reach=c?Number(c.accountReach||0):0;
  return `<div class="cyc">
    <div class="cyc-hdr">
      <span class="cyc-mon">${monthLabel(m)}</span>
      ${admin?`<button class="btn btn-p btn-xs" onclick="openPost('${sid}','${m}')">${t('addPub')}</button>
        <button class="icobtn" title="${t('editCy')}" onclick="openCycle('${sid}','${c?c.id:''}','${m}')">${ICO.pencil}</button>
        ${c?`<button class="btn-del" onclick="deleteCycle('${c.id}')">✕</button>`:''}`:''}
    </div>
    <div class="cyc-tiles">
      <div class="cyc-tile reach"><div class="cyc-tnum" style="color:var(--pur);">${nfmt(reach)}</div><div class="cyc-tlbl">${t('reachTile')}</div></div>
      <div class="cyc-tile"><div class="cyc-tnum" style="color:var(--blu);">${nfmt(v)}</div><div class="cyc-tlbl">${t('viewsTile')}</div></div>
      <div class="cyc-tile"><div class="cyc-tnum" style="color:var(--red);">${nfmt(l)}</div><div class="cyc-tlbl">${t('likesTile')}</div></div>
    </div>
    ${posts.length?posts.map(p=>pubHTML(p,admin)).join(''):`<div class="empty" style="padding:14px;">${t('noPubsCycle')}</div>`}
  </div>`;
}
function pubHTML(p,admin){
  const c=CTYPES[p.type]||CTYPES.carrusel;
  const link=(c.link&&p.link)?`<a class="pub-link" href="${esc(normUrl(p.link))}" target="_blank" rel="noopener">${t('view')}${ICO.external}</a>`:'';
  return `<div class="pub"><div class="pub-main">
    <div class="pub-ttl">${esc(p.title||t('notitle'))}</div>
    <div class="pub-sub"><span class="ct">${c.icon} ${esc(ctLabel(p.type))}</span><span class="pub-metric">${ICO.eye}${nfmt(p.views)}</span><span class="pub-metric">${ICO.heart}${nfmt(p.likes)}</span></div>
  </div>${link}${admin?`<div class="pub-actions"><button class="icobtn" onclick="openPost('${p.sponsorId}','${postMonth(p)}','${p.id}')">${ICO.pencil}</button><button class="btn-del" onclick="deletePost('${p.id}')">✕</button></div>`:''}</div>`;
}

/* actions */
function selectSponsor(id){ selSponsor=id; render(); }
function setCmpMetric(k){ _cmpMetric=k; render(); }
function openSponsor(id){
  document.getElementById('sp-id').value=id||''; const s=id?_sponsors[id]:null;
  document.getElementById('sp-mttl').textContent=id?t('editSp'):t('newSp');
  document.getElementById('sp-fname').value=s?.name||''; document.getElementById('sp-fpass').value=s?.pass||''; document.getElementById('sp-flogo').value=s?.logo||'';
  openMod('m-sponsor');
}
async function saveSponsorForm(){
  const id=document.getElementById('sp-id').value||uid();
  const name=document.getElementById('sp-fname').value.trim(); if(!name){ alert(t('needName')); return; }
  const pass=document.getElementById('sp-fpass').value.trim()||'123456', logo=document.getElementById('sp-flogo').value.trim()||'';
  await saveSponsor({id,name,pass,logo,createdAt:_sponsors[id]?.createdAt||Date.now()});
  selSponsor=id; closeMod('m-sponsor');
}
async function deleteSponsor(id){ const s=_sponsors[id]; if(!s) return; if(!confirm(t('delSp'))) return; for(const p of sponsorPosts(id)) await delPostFb(p.id); for(const c of sponsorCycles(id)) await delCycleFb(c.id); await delSponsorFb(id); if(selSponsor===id) selSponsor=null; }

function openCycle(sid,cid,month){
  document.getElementById('cy-sponsor').value=sid; document.getElementById('cy-id').value=cid||'';
  const c=cid?_cycles[cid]:null;
  document.getElementById('cy-mttl').textContent=cid?t('editCy'):t('newCy');
  document.getElementById('cy-month').value=c?c.month:(month||thisMonth());
  document.getElementById('cy-reach').value=c?(c.accountReach??''):'';
  openMod('m-cycle');
}
async function saveCycleForm(){
  const sid=document.getElementById('cy-sponsor').value, month=document.getElementById('cy-month').value;
  if(!month){ alert(t('needMonth')); return; }
  let id=document.getElementById('cy-id').value;
  const existingByMonth=cycleForMonth(sid,month);
  if(!id && existingByMonth) id=existingByMonth.id; // no duplicar el mes
  if(!id) id=uid();
  const reach=Number(document.getElementById('cy-reach').value||0);
  await saveCycle({id,sponsorId:sid,month,accountReach:reach,createdAt:_cycles[id]?.createdAt||Date.now()});
  closeMod('m-cycle');
}
async function deleteCycle(id){ const c=_cycles[id]; if(!c) return; if(!confirm(t('delCy'))) return; for(const p of postsInMonth(c.sponsorId,c.month)) await delPostFb(p.id); await delCycleFb(id); }

function openPost(sid,month,pid){
  document.getElementById('po-sponsor').value=sid; document.getElementById('po-month').value=month||thisMonth(); document.getElementById('po-id').value=pid||'';
  const p=pid?_posts[pid]:null;
  document.getElementById('po-mttl').textContent=pid?t('editPo'):t('newPo');
  document.getElementById('po-title').value=p?.title||'';
  document.getElementById('po-views').value=p?.views??''; document.getElementById('po-likes').value=p?.likes??''; document.getElementById('po-link').value=p?.link||'';
  selectPostType(p?.type||'carrusel'); openMod('m-post');
}
function renderTypePills(){ const c=document.getElementById('po-types'); if(!c) return; const cur=document.getElementById('po-type').value; c.innerHTML=Object.entries(CTYPES).map(([id,x])=>`<button type="button" class="ctype-pill ${id===cur?'on':''}" data-t="${id}" onclick="selectPostType('${id}')">${x.icon} ${esc(x[lang])}</button>`).join(''); }
function selectPostType(ty){ document.getElementById('po-type').value=ty; document.querySelectorAll('#po-types .ctype-pill').forEach(b=>b.classList.toggle('on',b.dataset.t===ty)); document.getElementById('po-link-wrap').style.display=CTYPES[ty]?.link?'block':'none'; }
async function savePostForm(){
  const sid=document.getElementById('po-sponsor').value, month=document.getElementById('po-month').value, id=document.getElementById('po-id').value||uid(), type=document.getElementById('po-type').value;
  const title=document.getElementById('po-title').value.trim(); if(!title){ alert(t('needTitle')); return; }
  const views=Number(document.getElementById('po-views').value||0), likes=Number(document.getElementById('po-likes').value||0);
  const link=CTYPES[type]?.link?(normUrl(document.getElementById('po-link').value)||null):null;
  const ex=_posts[id];
  await savePost({id,sponsorId:sid,month,type,title,views,likes,link,date:ex?.date||null,createdAt:ex?.createdAt||Date.now()});
  closeMod('m-post');
}
async function deletePost(id){ if(!confirm(t('delPo'))) return; await delPostFb(id); }
function openMod(id){ document.getElementById(id)?.classList.add('open'); }
function closeMod(id){ document.getElementById(id)?.classList.remove('open'); }

document.getElementById('l-btn').onclick=doLogin;
document.getElementById('l-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logout-btn').onclick=logout;
document.getElementById('sp-save').onclick=saveSponsorForm;
document.getElementById('cy-save').onclick=saveCycleForm;
document.getElementById('po-save').onclick=savePostForm;
document.querySelectorAll('.mov').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }));
Object.assign(window,{ closeMod,openSponsor,selectSponsor,setCmpMetric,deleteSponsor,openCycle,deleteCycle,openPost,deletePost,selectPostType,setLang });

startListening(); setLang('en');
</script>
